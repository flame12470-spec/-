<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>ระบบแชท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0f17;--line:#1d232e;--hover:#141a24;--sel:#1b2230;--text:#f1f4f9;--muted:#8b95a7;
  --me:#4f46e5;--other:#232a36;--accent:#4f5bf5;--danger:#ff5a6a;--ok:#2ecc71;--warn:#ffb020;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Prompt',system-ui,-apple-system,sans-serif;overflow:hidden;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;font-size:16px;color:var(--text)}
.hide{display:none!important}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em;flex:none}
img,video{-webkit-user-drag:none;-webkit-touch-callout:none}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:76px 380px 1fr;height:100dvh;transition:filter .15s}
#app.shield{filter:blur(22px)}
#rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(18px + var(--sat)) 0 calc(18px + var(--sab));border-right:1px solid var(--line)}
#rail .logo{font-size:30px;margin:10px 0 24px}
#rail .rb{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;position:relative}
#rail .rb:hover{background:var(--hover)}
#rail .rb.on{background:var(--sel)}
#rail .sp{flex:1}
#side{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);height:100dvh}
#main{display:flex;flex-direction:column;min-width:0;height:100dvh;position:relative}

/* ---------- list ---------- */
.s-head{display:flex;align-items:center;gap:10px;padding:calc(18px + var(--sat)) 20px 8px}
.uname{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:700;min-width:0}
.uname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uname .ico{font-size:16px}
.adm{background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px}
.s-head .sp{flex:1}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:26px;position:relative;flex:none}
.ib:hover{background:var(--hover)}
.searchbox{margin:8px 20px 6px;display:flex;align-items:center;gap:12px;background:#222a36;border-radius:99px;padding:0 18px;height:50px;color:var(--muted)}
.searchbox input{flex:1;background:none;border:0;outline:0;min-width:0}
.searchbox input::placeholder{color:var(--muted)}
.s-sub{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 6px}
.s-sub b{font-size:18px}
.s-sub button{color:var(--muted);font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.dotn{min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
#clist{flex:1;overflow-y:auto;padding:4px 8px calc(20px + var(--sab));-webkit-overflow-scrolling:touch}
.ci{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:14px;text-align:left}
.ci:hover{background:var(--hover)}
.ci.on{background:var(--sel)}
.ci .tx{flex:1;min-width:0}
.ci .tt{display:flex;gap:8px;align-items:center}
.ci .tt b{font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .pv{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.un .pv,.ci.un .tt b{color:var(--text);font-weight:700}
.ci .un-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.tg{font-size:11px;padding:1px 8px;border-radius:99px;background:#3a2330;color:#ff9aa8;white-space:nowrap}
.tg.s{background:#2a2f3a;color:var(--muted)}
.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;overflow:hidden}
.av .ico{font-size:55%}
.empty-list{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}

/* ---------- empty main ---------- */
#empty{margin:auto;text-align:center;padding:20px}
#empty .circ{width:96px;height:96px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:44px;margin:0 auto 18px}
#empty h2{font-size:24px;font-weight:600}
#empty p{color:var(--muted);margin:6px 0 18px}
.pbtn{background:var(--accent);color:#fff;font-weight:600;padding:11px 22px;border-radius:12px}
.pbtn:hover{filter:brightness(1.1)}
.pbtn.ghost{background:#222a36}
.pbtn.red{background:var(--danger)}
.pbtn.ok{background:var(--ok);color:#06210f}

/* ---------- chat ---------- */
#chat{display:flex;flex-direction:column;height:100%;min-height:0}
.ch{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--sat)) 18px 12px;border-bottom:1px solid var(--line)}
.ch .ttl{flex:1;min-width:0}
.ch .ttl b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .ttl small{color:var(--muted);font-size:13px}
.only-m{display:none}
#msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:3px;-webkit-overflow-scrolling:touch}
.sys{align-self:center;text-align:center;color:var(--muted);font-size:13px;padding:10px 18px;max-width:80%}
.sys.warn{color:#ffb4bd;background:#2a1a20;border-radius:14px;margin:8px 0}
.day{align-self:center;color:var(--muted);font-size:12px;margin:12px 0 6px}
.row{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.row.me{flex-direction:row-reverse}
.av-sp{width:28px;flex:none}
.col{display:flex;flex-direction:column;min-width:0;max-width:min(72%,520px)}
.row.me .col{align-items:flex-end}
.nm{color:var(--muted);font-size:12px;margin:6px 0 2px 4px}
.bub{padding:9px 15px;border-radius:20px;background:var(--other);overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px}
.row.me .bub{background:var(--me)}
.bub.media{padding:0;background:none}
.bub.gone{background:none;border:1px dashed #3a4252;color:var(--muted);font-style:italic}
.note{font-size:11px;color:var(--warn);margin:2px 6px}
.note.dim{color:var(--muted)}
.tm{font-size:11px;color:var(--muted);margin:2px 6px 6px}
.more{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0;flex:none;margin-bottom:6px}
.row:hover .more{opacity:1}
@media(hover:none){.more{opacity:.7}}
.more:hover{background:var(--hover)}
.med{position:relative;border-radius:18px;overflow:hidden;background:#111621;max-width:100%}
.med img{display:block;max-width:100%;max-height:340px;min-width:140px;min-height:100px;object-fit:cover;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.med video{display:block;max-width:100%;max-height:340px;min-width:200px;background:#000}
.med .lk{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 9px;border-radius:99px}
.lockmed{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:18px;background:#1a202b;color:var(--muted);font-size:14px;border:1px dashed #323a4a}
.lockmed .ico{font-size:22px}
audio{max-width:100%;height:42px;filter:invert(.9) hue-rotate(180deg)}
.filebox{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--other);text-align:left}
.row.me .filebox{background:var(--me)}
.filebox .ico{font-size:26px}
.filebox small{display:block;opacity:.75;font-size:12px}
.filebox b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:240px}

/* composer */
#comp{display:flex;align-items:flex-end;gap:6px;margin:10px 16px calc(12px + var(--sab));border:1px solid #2b3342;border-radius:26px;padding:6px 8px}
#comp textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:140px;min-height:40px;padding:9px 6px;line-height:1.5}
#comp textarea::placeholder{color:var(--muted)}
#comp .ib{width:42px;height:42px}
#comp .send{color:var(--accent);font-weight:700;padding:0 14px;height:42px}
#comp:not(.has) .send{display:none}
#comp.has .mic{display:none}
#rec{display:none;align-items:center;gap:12px;margin:10px 16px calc(12px + var(--sab));border:1px solid var(--danger);border-radius:26px;padding:8px 14px}
#rec.on{display:flex}
#rec i{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#rec span{flex:1}
body.recording #comp{display:none}
.banner{background:#2a1a20;color:#ffb4bd;padding:10px 18px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner .pbtn{padding:6px 14px;font-size:13px}
.lockview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}
.lockview .ico{font-size:64px;color:var(--muted)}
.lockview h3{font-size:22px}
.lockview p{color:var(--muted);margin-bottom:10px}
.blankbar{padding:calc(12px + var(--sat)) 18px}
.blank{flex:1}

/* ---------- สถานะกำลังพิมพ์ ---------- */
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:#9aa6bb;animation:tp 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.ci .pv.ty{color:var(--accent);font-weight:600}
#typ:empty{display:none}
.typrow{margin-top:4px}
#chSub.ty{color:var(--accent)}

/* ---------- sheet / toast / lightbox / call ---------- */
#sbg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;opacity:0;pointer-events:none;transition:.2s}
#sbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;top:50%;width:min(480px,92vw);max-height:86dvh;overflow:auto;background:#161c27;border:1px solid #232b39;border-radius:22px;z-index:101;padding:24px 22px 20px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.2s}
#sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#sheet h3{font-size:20px;margin-bottom:4px;padding-right:36px}
#sheet .xx{position:absolute;top:14px;right:14px;width:38px;height:38px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
#sheet label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
#sheet input[type=text],#sheet input[type=password]{width:100%;background:#222a36;border:2px solid transparent;border-radius:14px;padding:12px 14px;outline:0}
#sheet input:focus{border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 10px;border-radius:12px;text-align:left;font-size:16px}
.opt:hover{background:#1e2533}
.opt .ico{font-size:22px;color:var(--muted)}
.opt.danger{color:var(--danger)}.opt.danger .ico{color:var(--danger)}
.opt small{display:block;color:var(--muted);font-size:12px}
.hr{height:1px;background:var(--line);margin:12px 0}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts .pbtn{padding:8px 16px;font-size:14px}
.reqc{background:#1b2230;border-radius:14px;padding:12px 14px;margin-top:10px}
.reqc small{color:var(--muted)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.help{color:var(--muted);font-size:12px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translate(-50%,16px);background:#e8ecf3;color:#0b0f17;padding:10px 20px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-select:none}
#lb button{position:absolute;top:calc(14px + var(--sat));right:14px;font-size:30px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
#call{position:fixed;inset:0;background:#05070b;z-index:250;display:none;flex-direction:column;align-items:center;justify-content:center}
#call.on{display:flex}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05070b}
#lv{position:absolute;right:16px;top:calc(16px + var(--sat));width:min(30vw,160px);aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:#111;transform:scaleX(-1);z-index:2}
.cinfo{position:relative;z-index:2;text-align:center;margin-bottom:auto;margin-top:12vh;text-shadow:0 2px 10px #000}
.cinfo .av{margin:0 auto 14px}
.cinfo h3{font-size:26px}
.cinfo p{color:#cfd6e4}
.cbtn{position:relative;z-index:2;display:flex;gap:22px;margin-bottom:calc(40px + var(--sab))}
.cbtn button{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:28px;position:relative}
.cbtn button.off{background:#fff;color:#111}
.cbtn .end{background:var(--danger)}
.cbtn .end .ico{transform:rotate(135deg)}
.cbtn .acc{background:var(--ok)}
.cbtn .hide{display:none}

/* ---------- responsive ---------- */
@media(max-width:1100px){#app{grid-template-columns:64px 320px 1fr}#rail .rb{width:46px;height:46px}}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  #rail{display:none}
  #main{display:none}
  body.chat-open #side{display:none}
  body.chat-open #main{display:flex}
  .only-m{display:grid}
  .col{max-width:80%}
  #msgs{padding:12px}
}
@media(min-width:1500px){#app{grid-template-columns:84px 440px 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{display:none!important}}
</style>
</head>
<body>

<div id="app">
  <nav id="rail" aria-label="เมนู">
    <div class="logo" id="logoI"></div>
    <button class="rb on" data-act="home" aria-label="แชท" id="rbChat"></button>
    <button class="rb" data-act="focusSearch" aria-label="ค้นหา" id="rbSearch"></button>
    <button class="rb" data-act="newChat" aria-label="แชทใหม่" id="rbNew"></button>
    <button class="rb" data-act="requests" aria-label="คำขอและแอดมิน" id="rbAdm"></button>
    <div class="sp"></div>
    <button class="rb" data-act="settings" aria-label="ตั้งค่า" id="rbSet"></button>
  </nav>

  <section id="side">
    <div class="s-head">
      <button class="uname" data-act="settings"><b id="uname"></b><span id="unameC"></span></button>
      <span class="adm hide" id="admTag">แอดมิน</span>
      <span class="sp"></span>
      <button class="ib" data-act="newChat" aria-label="แชทใหม่" id="btnNew"></button>
    </div>
    <div class="searchbox"><span id="srI"></span><input id="cs" placeholder="ค้นหา" autocomplete="off"></div>
    <div class="s-sub"><b>ข้อความ</b><button data-act="requests">คำขอ <span class="dotn hide" id="reqN"></span></button></div>
    <div id="clist"></div>
  </section>

  <section id="main">
    <div id="empty">
      <div class="circ" id="emI"></div>
      <h2>ข้อความของคุณ</h2>
      <p>ส่งรูปภาพ วิดีโอ เสียง และข้อความส่วนตัวให้กับเพื่อนหรือกลุ่ม</p>
      <button class="pbtn" data-act="newChat">ส่งข้อความ</button>
    </div>
    <div id="chat" class="hide"></div>
  </section>
</div>

<input type="file" id="fi1" accept="image/*,video/*" multiple hidden>
<input type="file" id="fi2" multiple hidden>

<div id="sbg" data-act="closeSheet"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<div id="lb"><button data-act="closeLb" aria-label="ปิด" id="lbX"></button><img id="lbImg" alt="" draggable="false"></div>
<div id="call">
  <video id="rv" autoplay playsinline></video>
  <video id="lv" autoplay playsinline muted></video>
  <div class="cinfo"><div id="cav"></div><h3 id="cn"></h3><p id="cst"></p></div>
  <div class="cbtn">
    <button id="cMic" data-act="callMic" aria-label="ไมค์"></button>
    <button id="cCam" data-act="callCam" aria-label="กล้อง"></button>
    <button class="acc hide" id="cAcc" data-act="callAcc" aria-label="รับสาย"></button>
    <button class="end" id="cEnd" data-act="callEnd" aria-label="วางสาย"></button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
// ===================== ตั้งค่า =====================
const ADMIN_PIN='123456';           // รหัสแอดมิน (หมายเหตุ: อยู่ในโค้ดฝั่งผู้ใช้ ใครเปิดดูซอร์สก็เห็น ถ้าจะใช้จริงต้องย้ายไปตรวจที่เซิร์ฟเวอร์)
const MAX_FILE=100*1024*1024;       // ขนาดไฟล์สูงสุด 100MB
const ICE=[{urls:'stun:stun.l.google.com:19302'}];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){return false}return true}};
const SS={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};

// ===================== โหมดคลาวด์ (Supabase) =====================
// ใส่ค่าจากโปรเจกต์ Supabase ใหม่ของระบบแชท (รัน chat-schema.sql ก่อน) ถ้าเว้นว่าง = ทำงานในเครื่องเหมือนเดิม
const SB_URL='';
const SB_KEY='';
const CLOUD=!!(SB_URL&&SB_KEY&&window.supabase&&window.supabase.createClient);
let ATOKEN=SS.get('chat.atoken')||'';
const sb=CLOUD?window.supabase.createClient(SB_URL,SB_KEY,{
 auth:{persistSession:false,autoRefreshToken:false},
 global:{fetch:(u,o)=>{const h=new Headers((o&&o.headers)||{});if(ATOKEN)h.set('x-admin-token',ATOKEN);return fetch(u,Object.assign({},o,{headers:h}))}}
}):null;
let RLCH=null;               // ช่อง realtime
const CHATP={};              // รอสร้างแชทเสร็จก่อนส่งข้อความแรก
const rowToChat=r=>({id:r.id,type:r.type,name:r.name||'',members:r.members||[],closed:!!r.closed,silent:!!r.silent,closedBy:r.closed_by||'',closedNote:r.closed_note||'',closedAt:r.closed_at?new Date(r.closed_at).getTime():0});
const rowToMsg=r=>({id:r.id,t:new Date(r.created_at).getTime(),type:r.type,text:r.body||'',from:r.from_user||undefined,mid:r.media_path||undefined,mime:r.mime||'',name:r.file_name||'',size:r.size||0,locked:!!r.locked,unsend:r.unsend||undefined,warn:r.warn?1:undefined});
const msgToRow=(cid,m)=>({id:m.id,chat_id:cid,type:m.type,from_user:m.from||null,body:m.text||null,media_path:m.mid||null,mime:m.mime||null,file_name:m.name||null,size:m.size||null,warn:!!m.warn});

// ===================== ไอคอน =====================

let DB={chats:[],msgs:{}},ME=LS.get('chat.me')||'',ADMIN=SS.get('chat.admin')==='1',OPEN=null,FRAME='',FILTER='';
let BLUR=LS.get('chat.blur')!=='0',PINNEXT=null;
let READ={};
function loadRead(){try{READ=JSON.parse(LS.get('chat.read.'+ME)||'{}')}catch(e){READ={}}}
function saveRead(){LS.set('chat.read.'+ME,JSON.stringify(READ))}
function load(){
 if(CLOUD)return;
 try{const d=JSON.parse(LS.get('chat.db')||'null');if(d&&d.chats)DB=d}catch(e){}
 if(!DB.msgs)DB.msgs={};
 // ย้ายข้อมูลเก่า: เปลี่ยนชื่อห้องตั้งต้นที่เคยใช้ชื่อ ม.4/4 ให้เป็นชื่อกลาง
 const oldRoom=DB.chats.find(c=>c.id==='room-44');
 if(oldRoom){
  if(/ม\.4\/4/.test(oldRoom.name))oldRoom.name='ห้องแชทรวม';
  (DB.msgs['room-44']||[]).forEach(m=>{if(m.type==='system'&&/ม\.4\/4/.test(m.text||''))m.text='ยินดีต้อนรับสู่ห้องแชทรวม'});
  save();
 }
 if(!DB.chats.length){
  DB.chats.push({id:'room-main',type:'group',name:'ห้องแชทรวม',members:['*'],closed:false,silent:false});
  DB.msgs['room-main']=[{id:uid(),t:Date.now(),type:'system',text:'ยินดีต้อนรับสู่ห้องแชทรวม'}];
  save();
 }
}
function save(){if(CLOUD)return;if(LS.set('chat.db',JSON.stringify(DB))===false)toast('พื้นที่จัดเก็บเต็ม')}
const chatById=id=>DB.chats.find(c=>c.id===id);
const msgsOf=id=>DB.msgs[id]||(DB.msgs[id]=[]);
function addMsg(cid,m){
 const x=Object.assign({id:uid(),t:Date.now()},m);
 msgsOf(cid).push(x);
 if(CLOUD)cloudInsert(cid,x);else save();
 return x;
}
async function cloudInsert(cid,x){
 try{
  if(CHATP[cid])await CHATP[cid];
  const r=await sb.from('messages').insert(msgToRow(cid,x));
  if(r.error)throw r.error;
 }catch(e){
  const a=msgsOf(cid),i=a.findIndex(y=>y.id===x.id);if(i>-1)a.splice(i,1);
  refresh();toast('ส่งไม่สำเร็จ: '+(e.message||e));
 }
}
const peerOf=c=>c.members.find(x=>x!==ME)||ME;
const chatName=c=>c.type==='dm'?peerOf(c):c.name;
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
const dayLbl=t=>{const d=new Date(t);return dayKey(t)===dayKey(Date.now())?'วันนี้':d.getDate()+' '+TH[d.getMonth()]};
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function visible(){
 const L=DB.chats.filter(c=>ADMIN||c.members.includes('*')||c.members.includes(ME));
 const lt=c=>{const m=msgsOf(c.id);return m.length?m[m.length-1].t:0};
 return L.sort((a,b)=>lt(b)-lt(a));
}
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)};

// ===================== สื่อ (IndexedDB) =====================
let _idb;
const idb=()=>_idb||(_idb=new Promise((res,rej)=>{const r=indexedDB.open('chat-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const putBlob=(k,b)=>idb().then(d=>new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)}));
const getBlob=k=>idb().then(d=>new Promise((res,rej)=>{const q=d.transaction('m').objectStore('m').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const URLS={};
async function urlFor(mid){if(URLS[mid])return URLS[mid];const b=await getBlob(mid);if(!b)return null;return URLS[mid]=URL.createObjectURL(b)}
function hydrate(root){
 root.querySelectorAll('[data-mid]').forEach(el=>{
  if(el.dataset.ok)return;
  urlFor(el.dataset.mid).then(u=>{if(u){el.src=u;el.dataset.ok='1'}}).catch(()=>{});
 });
}

// ===================== avatar =====================
function av(name,s,group){
 const h=[...String(name)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360;
 const ch=(String(name).replace(/[^A-Za-z0-9ก-๙]/g,'')[0]||'?').toUpperCase();
 return '<span class="av" style="width:'+s+'px;height:'+s+'px;background:hsl('+h+',42%,36%);font-size:'+Math.round(s*.42)+'px">'+(group?I('users'):esc(ch))+'</span>';
}

function pvText(m){
 if(!m)return '';
 if(m.unsend==='done')return 'ข้อความถูกยกเลิก';
 const mine=m.from===ME?'คุณ: ':'';
 if(m.type==='system')return m.text;
 if(m.type==='text')return mine+m.text;
 if(m.type==='image')return mine+'ส่งรูปภาพ';
 if(m.type==='video')return mine+'ส่งวิดีโอ';
 if(m.type==='audio')return mine+'ส่งข้อความเสียง';
 return mine+'ส่งไฟล์ '+(m.name||'');
}
function renderList(){
 const q=FILTER.trim().toLowerCase();
 const L=visible().filter(c=>!q||chatName(c).toLowerCase().includes(q));
 $('#clist').innerHTML=L.length?L.map(c=>{
  const ms=msgsOf(c.id),last=ms[ms.length-1],locked=c.closed&&!ADMIN;
  const un=!locked&&last&&last.from&&last.from!==ME&&last.t>(READ[c.id]||0)&&c.id!==OPEN;
  let pv=locked?(c.silent?'':'แชทถูกปิด'):pvText(last);
  const ty=!locked&&typers(c.id).length>0;if(ty)pv='กำลังพิมพ์...';
  return '<button class="ci'+(c.id===OPEN?' on':'')+(un?' un':'')+'" data-act="open" data-id="'+esc(c.id)+'">'+av(locked&&c.silent?'?':chatName(c),56,c.type==='group'&&!(locked&&c.silent))+
   '<div class="tx"><div class="tt"><b>'+(locked&&c.silent?'':esc(chatName(c)))+'</b>'+(c.closed?(ADMIN?'<span class="tg">'+(c.silent?'ปิดแบบเงียบ':'ปิดอยู่')+'</span>':''):'')+'</div><div class="pv'+(ty?' ty':'')+'">'+esc(pv)+(last&&!locked&&!ty?' · '+hm(last.t):'')+'</div></div>'+(un?'<span class="un-dot"></span>':'')+'</button>';
 }).join(''):'<div class="empty-list">ยังไม่มีแชท กดปุ่มแชทใหม่เพื่อเริ่มต้น</div>';
 const n=pendingReqs().length;const b=$('#reqN');b.textContent=n;b.classList.toggle('hide',!(ADMIN&&n));
}
function pendingReqs(){
 const out=[];
 DB.chats.forEach(c=>msgsOf(c.id).forEach(m=>{if(m.unsend==='pending')out.push({c:c,m:m})}));
 return out;
}

const frameKey=()=>{const c=chatById(OPEN);return c?[c.id,c.closed,c.silent,ADMIN,c.type].join('|'):''};
function openChat(id){
 OPEN=id;READ[id]=Date.now();saveRead();
 document.body.classList.add('chat-open');

}
function closeChatView(){
 OPEN=null;FRAME='';document.body.classList.remove('chat-open');renderChat();renderList();

 if(!c){$('#empty').classList.remove('hide');box.classList.add('hide');box.innerHTML='';FRAME='';return}

  return;
 }
 box.innerHTML=head+(c.closed?'<div class="banner"><span>แชทนี้ปิดอยู่ (เห็นได้เฉพาะแอดมิน)</span><button class="pbtn" data-act="adminOpen">เปิดแชท</button></div>':'')+
  '<div id="msgs"></div>'+

function mediaHtml(m){
 const hid=m.locked&&!ADMIN;
 if(m.type==='image'||m.type==='video'){
  if(hid)return '<div class="lockmed">'+I('eyeoff')+'<span>'+(m.type==='image'?'ภาพ':'วิดีโอ')+'นี้ถูกล็อกโดยแอดมิน</span></div>';
  const badge=m.locked?'<span class="lk">'+I('lock')+' ล็อกอยู่</span>':'';
  return m.type==='image'
   ?'<div class="med"><img data-mid="'+esc(m.mid)+'" data-act="viewImg" alt="" draggable="false">'+badge+'</div>'
   :'<div class="med"><video data-mid="'+esc(m.mid)+'" controls playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>'+badge+'</div>';
 }
 if(m.type==='audio')return '<audio data-mid="'+esc(m.mid)+'" controls controlslist="nodownload"></audio>';
 return '<button class="filebox" data-act="dlFile" data-id="'+esc(m.id)+'">'+I('file')+'<span><b>'+esc(m.name||'ไฟล์')+'</b><small>'+fmtSize(m.size||0)+'</small></span>'+I('download')+'</button>';
}
function msgHtml(m,prev,next,grp){
 if(m.type==='system')return '<div class="sys'+(m.warn?' warn':'')+'">'+esc(m.text)+'</div>';
 const mine=m.from===ME,lastOfG=!next||next.type==='system'||next.from!==m.from,firstOfG=!prev||prev.type==='system'||prev.from!==m.from;
 const gone=m.unsend==='done';
 let body;
 if(gone&&!ADMIN)body='<div class="bub gone">ข้อความถูกยกเลิก</div>';
 else if(m.type==='text')body='<div class="bub">'+esc(m.text)+'</div>';
 else body='<div class="bub media">'+mediaHtml(m)+'</div>';
 let note='';
 if(m.unsend==='pending'&&(mine||ADMIN))note='<div class="note">ขอยกเลิก รอแอดมินอนุมัติ</div>';
 if(gone&&ADMIN)note='<div class="note dim">ข้อความนี้ถูกยกเลิกแล้ว (เห็นเฉพาะแอดมิน)</div>';
 return '<div class="row '+(mine?'me':'ot')+'" data-id="'+esc(m.id)+'">'+
  (!mine?(lastOfG?av(m.from,28):'<span class="av-sp"></span>'):'')+
  '<div class="col">'+(!mine&&grp&&firstOfG?'<span class="nm">'+esc(m.from)+'</span>':'')+body+note+(lastOfG?'<span class="tm">'+hm(m.t)+'</span>':'')+'</div>'+
  '<button class="more" data-act="msgMenu" data-id="'+esc(m.id)+'" aria-label="ตัวเลือก">'+I('more')+'</button></div>';

function renderMsgs(forceBottom){
 const el=$('#msgs'),c=chatById(OPEN);if(!el||!c)return;
 const near=forceBottom||el.scrollHeight-el.scrollTop-el.clientHeight<140;
 const ms=msgsOf(c.id),grp=c.type==='group';let h='',pd='';
 ms.forEach((m,i)=>{
  const dk=dayKey(m.t);if(dk!==pd){h+='<div class="day">'+dayLbl(m.t)+'</div>';pd=dk}
  h+=msgHtml(m,ms[i-1],ms[i+1],grp);
 });
 el.innerHTML=(h||'<div class="sys">ยังไม่มีข้อความ ลองส่งข้อความแรกเลย</div>')+'<div id="typ"></div>';
 updateTypingBubble(false);
 hydrate(el);
 if(near)el.scrollTop=el.scrollHeight;
}
function refresh(){ // เรียกหลังข้อมูลเปลี่ยน
 renderList();
 if(!OPEN)return;
 if(!chatById(OPEN)||frameKey()!==FRAME)renderChat();else{renderMsgs(false);READ[OPEN]=Date.now();saveRead()}
}

// ===================== สถานะกำลังพิมพ์ =====================
// ใช้ BroadcastChannel (ข้ามแท็บบนเครื่องเดียวกัน) ถ้าต่อหลังบ้านให้ส่งเหตุการณ์ typing ผ่าน Realtime แทน
const TYPING={};                       // TYPING[chatId][user] = เวลาหมดอายุ (ms)
const TYPC=('BroadcastChannel' in window)?new BroadcastChannel('chat-typing'):null;
let TLAST=0,TOFF=null;const TCLR={};
function typers(cid){const o=TYPING[cid]||{},n=Date.now();return Object.keys(o).filter(u=>u!==ME&&o[u]>n)}
function subText(c){
 const t=typers(c.id);
 if(t.length&&!(c.closed&&!ADMIN))return c.type==='dm'?'กำลังพิมพ์...':t.join(', ')+' กำลังพิมพ์...';
 return (c.type==='dm'?'@'+peerOf(c):(c.members.includes('*')?'ทุกคน':c.members.length+' คน'))+(c.closed?' · ปิดอยู่':'');
}
function updateTypingBubble(scroll){
 const el=$('#typ'),c=chatById(OPEN);if(!el||!c)return;
 const t=(c.closed&&!ADMIN)?[]:typers(c.id),box=$('#msgs');
 const near=box&&box.scrollHeight-box.scrollTop-box.clientHeight<160;
 el.innerHTML=t.length?'<div class="row ot typrow">'+av(t[0],28)+'<div class="col">'+(c.type==='group'?'<span class="nm">'+esc(t.join(', '))+' กำลังพิมพ์</span>':'')+'<div class="bub typing" aria-label="กำลังพิมพ์"><i></i><i></i><i></i></div></div></div>':'';
 const s=$('#chSub');if(s){s.textContent=subText(c);s.classList.toggle('ty',t.length>0)}
 if(scroll&&near&&box)box.scrollTop=box.scrollHeight;
}
function typingSet(cid,user,on){
 if(user===ME)return;
 const o=TYPING[cid]||(TYPING[cid]={}),key=cid+'|'+user;
 clearTimeout(TCLR[key]);
 if(on){o[user]=Date.now()+4000;TCLR[key]=setTimeout(()=>typingSet(cid,user,false),4100)}else delete o[user];
 renderList();if(cid===OPEN)updateTypingBubble(true);
}
function typingPing(on){
 if(!TYPC||!OPEN)return;
 const c=chatById(OPEN);if(!c||(c.closed&&!ADMIN))return;
 TYPC.postMessage({chat:OPEN,from:ME,on:on});
}
function typingInput(hasText){
 if(!hasText){clearTimeout(TOFF);if(TLAST){TLAST=0;typingPing(false)}return}
 const n=Date.now();
 if(n-TLAST>2000){TLAST=n;typingPing(true)}
 clearTimeout(TOFF);TOFF=setTimeout(()=>{TLAST=0;typingPing(false)},3000);
}
if(TYPC)TYPC.onmessage=e=>{const d=e.data||{};if(d.chat&&d.from)typingSet(d.chat,d.from,!!d.on)};

// ===================== ส่งข้อความ / ไฟล์ =====================
function canSend(){const c=chatById(OPEN);if(!c)return false;if(c.closed&&!ADMIN){toast('แชทถูกปิด ส่งไม่ได้');return false}return true}
function sendText(){
 const t=$('#inp');if(!t||!canSend())return;
 const v=t.value.trim();if(!v)return;
 addMsg(OPEN,{from:ME,type:'text',text:v});
 t.value='';t.style.height='';$('#comp').classList.remove('has');typingInput(false);
 refresh();t.focus();
}
async function sendFile(file){
 if(!canSend())return;
 if(file.size>MAX_FILE)return toast('ไฟล์ใหญ่เกิน '+fmtSize(MAX_FILE));
 const mt=file.type||'';
 const type=mt.startsWith('image/')?'image':mt.startsWith('video/')?'video':mt.startsWith('audio/')?'audio':'file';
 const id=uid();
 try{await putBlob(id,file)}catch(e){return toast('บันทึกไฟล์ไม่สำเร็จ')}
 addMsg(OPEN,{from:ME,type:type,mid:id,mime:mt,name:file.name||'ไฟล์',size:file.size});

}

let REC=null,RCH=[],RSTREAM=null,RT=null,RT0=0,RSEND=false;
async function recStart(){
 if(!canSend())return;
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('อุปกรณ์นี้ไม่รองรับการบันทึกเสียง');
 try{RSTREAM=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('ไม่ได้รับอนุญาตใช้ไมโครโฟน')}
 RCH=[];RSEND=false;REC=new MediaRecorder(RSTREAM);
 REC.ondataavailable=e=>{if(e.data&&e.data.size)RCH.push(e.data)};
 REC.onstop=async()=>{
  RSTREAM.getTracks().forEach(t=>t.stop());clearInterval(RT);
  document.body.classList.remove('recording');const r=$('#rec');if(r)r.classList.remove('on');
  if(RSEND&&RCH.length){const b=new Blob(RCH,{type:REC.mimeType||'audio/webm'});await sendFile(new File([b],'voice-'+Date.now()+'.'+((REC.mimeType||'').includes('mp4')?'m4a':'webm'),{type:b.type}))}
  REC=null;
 };
 REC.start();RT0=Date.now();document.body.classList.add('recording');$('#rec').classList.add('on');
 RT=setInterval(()=>{const s=Math.floor((Date.now()-RT0)/1000);const e=$('#recT');if(e)e.textContent=Math.floor(s/60)+':'+pad(s%60)},250);
}
function recStop(send){if(!REC)return;RSEND=send;try{REC.stop()}catch(e){}}

// ===================== โทร (WebRTC) =====================
// สัญญาณใช้ BroadcastChannel จึงโทรได้ระหว่างแท็บ/หน้าต่างบนเบราว์เซอร์เดียวกัน
// ถ้าจะโทรข้ามเครื่อง ต้องเปลี่ยน sig() ไปใช้เซิร์ฟเวอร์สัญญาณ (เช่น Supabase Realtime / WebSocket)
const SIG=('BroadcastChannel' in window)?new BroadcastChannel('chat-sig'):null;
let PC=null,LOC=null,CALL=null,PEND=[],CT=null,CT0=0,RING=null;
function sig(o){if(SIG)SIG.postMessage(Object.assign({from:ME},o))}
function callUI(state,name,video){
 $('#call').classList.add('on');
 $('#cav').innerHTML=av(name,96);$('#cn').textContent=name;
 $('#cst').textContent=state==='in'?(video?'วิดีโอคอลเรียกเข้า':'สายเรียกเข้า'):state==='out'?'กำลังโทร...':'';
 $('#cAcc').classList.toggle('hide',state!=='in');
 $('#cMic').classList.toggle('hide',state==='in');$('#cCam').classList.toggle('hide',state==='in'||!video);
 $('#cMic').classList.remove('off');$('#cCam').classList.remove('off');
}
async function mkPC(video){
 if(!navigator.mediaDevices||!window.RTCPeerConnection)throw Error('อุปกรณ์ไม่รองรับการโทร');
 LOC=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false});
 $('#lv').srcObject=LOC;$('#lv').style.display=video?'block':'none';
 PC=new RTCPeerConnection({iceServers:ICE});
 LOC.getTracks().forEach(t=>PC.addTrack(t,LOC));
 PC.ontrack=e=>{$('#rv').srcObject=e.streams[0]};
 PC.onicecandidate=e=>{if(e.candidate&&CALL)sig({t:'ice',to:CALL.peer,c:e.candidate})};
 PC.onconnectionstatechange=()=>{if(!PC)return;if(['failed','closed'].includes(PC.connectionState))endCall(false)};
}
async function startCall(video){
 const c=chatById(OPEN);if(!c||c.type!=='dm')return;
 if(c.closed&&!ADMIN)return toast('แชทถูกปิด โทรไม่ได้');
 if(CALL)return;
 if(!SIG)return toast('เบราว์เซอร์ไม่รองรับการโทรในโหมดนี้');
 CALL={chat:c.id,peer:peerOf(c),video:video,out:true,connected:false};PEND=[];
 callUI('out',CALL.peer,video);
 try{
  await mkPC(video);
  const off=await PC.createOffer();await PC.setLocalDescription(off);
  sig({t:'offer',to:CALL.peer,chat:c.id,video:video,sdp:PC.localDescription});
  RING=setTimeout(()=>{if(CALL&&!CALL.connected){addMsg(CALL.chat,{type:'system',text:'การโทรไม่มีผู้รับสาย'});endCall(true);refresh()}},40000);
 }catch(e){toast(e.message||'เริ่มการโทรไม่สำเร็จ (ต้องใช้ https และอนุญาตกล้อง/ไมค์)');endCall(false)}
}
async function acceptCall(){
 if(!CALL||CALL.out)return;
 try{
  await mkPC(CALL.video);
  await PC.setRemoteDescription(CALL.offer);
  for(const c of PEND)try{await PC.addIceCandidate(c)}catch(e){}PEND=[];
  const ans=await PC.createAnswer();await PC.setLocalDescription(ans);
  sig({t:'answer',to:CALL.peer,sdp:PC.localDescription});
  connected();
 }catch(e){toast(e.message||'รับสายไม่สำเร็จ');endCall(true)}
}
function connected(){
 CALL.connected=true;clearTimeout(RING);CT0=Date.now();
 $('#cAcc').classList.add('hide');$('#cMic').classList.remove('hide');if(CALL.video)$('#cCam').classList.remove('hide');
 clearInterval(CT);CT=setInterval(()=>{const s=Math.floor((Date.now()-CT0)/1000);$('#cst').textContent=pad(Math.floor(s/60))+':'+pad(s%60)},500);
 $('#cst').textContent='00:00';
}
function endCall(send){
 if(send&&CALL)sig({t:'end',to:CALL.peer});
 clearTimeout(RING);clearInterval(CT);
 const was=CALL;
 if(LOC)LOC.getTracks().forEach(t=>t.stop());LOC=null;
 if(PC){try{PC.close()}catch(e){}}PC=null;
 $('#rv').srcObject=null;$('#lv').srcObject=null;$('#call').classList.remove('on');
 if(was&&was.connected&&was.out){const s=Math.floor((Date.now()-CT0)/1000);addMsg(was.chat,{type:'system',text:'การโทรสิ้นสุด '+pad(Math.floor(s/60))+':'+pad(s%60)});refresh()}
 CALL=null;PEND=[];
}
if(SIG)SIG.onmessage=async ev=>{
 const d=ev.data||{};if(d.to!==ME)return;
 if(d.t==='offer'){
  const c=chatById(d.chat);
  if(CALL||!c||(c.closed&&!ADMIN)){sig({t:'end',to:d.from});return}
  CALL={chat:d.chat,peer:d.from,video:d.video,offer:d.sdp,out:false,connected:false};PEND=[];
  callUI('in',d.from,d.video);
 }else if(d.t==='answer'&&PC&&CALL&&CALL.out){
  try{await PC.setRemoteDescription(d.sdp);for(const c of PEND)try{await PC.addIceCandidate(c)}catch(e){}PEND=[];connected()}catch(e){}
 }else if(d.t==='ice'){
  if(PC&&PC.remoteDescription){try{await PC.addIceCandidate(d.c)}catch(e){}}else PEND.push(d.c);
 }else if(d.t==='end'){
  if(CALL){const w=CALL;toast(w.connected?'อีกฝ่ายวางสาย':w.out?'อีกฝ่ายไม่รับสาย':'ผู้โทรยกเลิก');endCall(false)}
 }
};

 exitAdmin(){setAdmin(false);closeSheet();toast('ออกจากโหมดแอดมินแล้ว')},
 chatAdmin:chatAdminSheet,
 doOpen(){setClosed(OPEN,false);closeSheet()},
 doClose(){setClosed(OPEN,true,false);closeSheet()},
 doCloseSilent(){setClosed(OPEN,true,true);closeSheet()},
 adminOpen(){needAdmin(()=>setClosed(OPEN,false))},
 openById(t){setClosed(t.dataset.id,false);closeSheet();toast('เปิดแชทแล้ว')},
 approve(t){decide(t.dataset.id,true);closeSheet();toast('อนุมัติการยกเลิกแล้ว')},
 reject(t){decide(t.dataset.id,false);closeSheet();toast('ปฏิเสธคำขอแล้ว')},
 reqUnsend(t){
  const c=chatById(OPEN),m=c&&msgsOf(c.id).find(x=>x.id===t.dataset.id);
  if(m&&m.from===ME&&!m.unsend){m.unsend='pending';m.reqAt=Date.now();save();refresh();toast('ส่งคำขอยกเลิกให้แอดมินแล้ว')}
  closeSheet();
 },
 toggleLock(t){
  const c=chatById(OPEN),m=c&&msgsOf(c.id).find(x=>x.id===t.dataset.id);
  if(m&&ADMIN){m.locked=!m.locked;save();refresh();toast(m.locked?'ล็อกแล้ว':'ปลดล็อกแล้ว')}
  closeSheet();
 },
 msgMenu(t){msgMenu(t.dataset.id)},
 viewImg(t){viewImg(t.dataset.mid)},
 dlFile(t){dlFile(t.dataset.id)},
 sendText:sendText,
 pickImg(){$('#fi1').click()},pickFile(){$('#fi2').click()},
 recStart:recStart,recCancel(){recStop(false)},recSend(){recStop(true)},
 call(){startCall(false)},vcall(){startCall(true)},
 callAcc:acceptCall,callEnd(){endCall(true)},
 callMic(t){if(LOC){const a=LOC.getAudioTracks()[0];if(a){a.enabled=!a.enabled;t.classList.toggle('off',!a.enabled)}}},
 callCam(t){if(LOC){const v=LOC.getVideoTracks()[0];if(v){v.enabled=!v.enabled;t.classList.toggle('off',!v.enabled)}}},
 toggleBlur(t){BLUR=t.checked;LS.set('chat.blur',BLUR?'1':'0')},
 resetAll(){
  if(!confirm('ล้างข้อความและข้อมูลทั้งหมดในเครื่องนี้?'))return;
  try{localStorage.removeItem('chat.db')}catch(e){}
  try{indexedDB.deleteDatabase('chat-media')}catch(e){}
  location.reload();
 }
};
document.addEventListener('click',function(e){
 const t=e.target.closest('[data-act]');if(!t||t.type==='checkbox'||!t.dataset.act)return;
 const f=A[t.dataset.act];if(f){e.preventDefault();try{const r=f(t,e);if(r&&r.catch)r.catch(x=>toast(x.message||String(x)))}catch(x){toast(x.message||String(x))}}
});
document.addEventListener('change',function(e){
 const t=e.target;
 if(t.type==='checkbox'&&t.dataset.act==='toggleBlur')A.toggleBlur(t);
 if(t.id==='fi1'||t.id==='fi2'){const fs=Array.from(t.files||[]);t.value='';sendFiles(fs)}
});
document.addEventListener('input',function(e){
 const t=e.target;
 if(t.id==='cs'){FILTER=t.value;renderList()}
 if(t.id==='inp'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px';$('#comp').classList.toggle('has',!!t.value.trim());typingInput(!!t.value.trim())}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='inp'&&!e.isComposing){e.preventDefault();sendText()}
 if(e.key==='Enter'&&e.target.id==='pin'){e.preventDefault();pinOk()}
 if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();saveName()}
 if(e.key==='Enter'&&e.target.id==='np'){e.preventDefault();startDM()}
 if(e.key==='Escape'){closeSheet();A.closeLb()}
});
// ลากไฟล์มาวางในแชท
['dragover','drop'].forEach(n=>$('#main').addEventListener(n,function(e){
 if(!OPEN)return;e.preventDefault();
 if(n==='drop'&&e.dataTransfer&&e.dataTransfer.files.length)sendFiles(Array.from(e.dataTransfer.files));
}));
// ซิงก์ข้อมูลข้ามแท็บ
window.addEventListener('storage',function(e){
 if(e.key==='chat.db'){load();refresh()}
 if(e.key==='chat.read.'+ME)loadRead();
});

// ===================== เริ่มต้น =====================
function init(){
 $('#logoI').innerHTML=I('chat');$('#rbChat').innerHTML=I('chat');$('#rbSearch').innerHTML=I('search');$('#rbNew').innerHTML=I('plus');
 $('#rbAdm').innerHTML=I('shield');$('#rbSet').innerHTML=I('gear');$('#unameC').innerHTML=I('chev');$('#btnNew').innerHTML=I('compose');
 $('#srI').innerHTML=I('search');$('#emI').innerHTML=I('send');$('#lbX').innerHTML=I('x');
 $('#cMic').innerHTML=I('mic');$('#cCam').innerHTML=I('video');$('#cAcc').innerHTML=I('phone');$('#cEnd').innerHTML=I('phone');
 load();loadRead();
 $('#admTag').classList.toggle('hide',!ADMIN);
 $('#uname').textContent=ME||'ผู้ใช้';
 renderList();renderChat();
 if(!ME)nameSheet(true);
}
init();
})();
</script>
</body>
</html>
