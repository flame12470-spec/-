<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ระบบแชท">
<link id="appIcon" rel="apple-touch-icon" href="">
<link id="appManifest" rel="manifest" href="">
<title>ระบบแชท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0f17;--line:#1d232e;--hover:#141a24;--sel:#1b2230;--text:#f1f4f9;--muted:#8b95a7;
  --me:#4f46e5;--other:#232a36;--accent:#4f5bf5;--danger:#ff5a6a;--ok:#2ecc71;--warn:#ffb020;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Prompt',system-ui,-apple-system,sans-serif;overflow:hidden;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;font-size:16px;color:var(--text)}
.hide{display:none!important}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em;flex:none}
img,video{-webkit-user-drag:none;-webkit-touch-callout:none}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:76px 380px 1fr;height:100dvh;transition:filter .15s}
#app.shield{filter:blur(22px)}
#rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(18px + var(--sat)) 0 calc(18px + var(--sab));border-right:1px solid var(--line)}
#rail .logo{font-size:30px;margin:10px 0 24px}
#rail .rb{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;position:relative}
#rail .rb:hover{background:var(--hover)}
#rail .rb.on{background:var(--sel)}
#rail .sp{flex:1}
#side{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);height:100dvh}
#main{display:flex;flex-direction:column;min-width:0;height:100dvh;position:relative}

/* ---------- list ---------- */
.s-head{display:flex;align-items:center;gap:10px;padding:calc(18px + var(--sat)) 20px 8px}
.uname{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:700;min-width:0}
.uname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uname .ico{font-size:16px}
.adm{background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px}
.rt{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.rt.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.rt.err{background:var(--danger)}
.s-head .sp{flex:1}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:26px;position:relative;flex:none}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--sel);color:var(--accent)}
.searchbox{margin:8px 20px 6px;display:flex;align-items:center;gap:12px;background:#222a36;border-radius:99px;padding:0 18px;height:50px;color:var(--muted)}
.searchbox input{flex:1;background:none;border:0;outline:0;min-width:0}
.searchbox input::placeholder{color:var(--muted)}
.s-sub{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 6px}
.s-sub b{font-size:18px}
.s-sub button{color:var(--muted);font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.dotn{min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
#clist{flex:1;overflow-y:auto;padding:4px 8px calc(20px + var(--sab));-webkit-overflow-scrolling:touch}
.ci{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:14px;text-align:left}
.ci:hover{background:var(--hover)}
.ci.on{background:var(--sel)}
.ci .tx{flex:1;min-width:0}
.ci .tt{display:flex;gap:8px;align-items:center}
.ci .tt b{font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .pv{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.un .pv,.ci.un .tt b{color:var(--text);font-weight:700}
.ci .un-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.tg{font-size:11px;padding:1px 8px;border-radius:99px;background:#3a2330;color:#ff9aa8;white-space:nowrap}
.tg.s{background:#2a2f3a;color:var(--muted)}
.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;overflow:hidden}
.av .ico{font-size:55%}
.empty-list{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}

/* ---------- empty main ---------- */
#empty{margin:auto;text-align:center;padding:20px}
#empty .circ{width:96px;height:96px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:44px;margin:0 auto 18px}
#empty h2{font-size:24px;font-weight:600}
#empty p{color:var(--muted);margin:6px 0 18px}
.pbtn{background:var(--accent);color:#fff;font-weight:600;padding:11px 22px;border-radius:12px}
.pbtn:hover{filter:brightness(1.1)}
.pbtn.ghost{background:#222a36}
.pbtn.red{background:var(--danger)}
.pbtn.ok{background:var(--ok);color:#06210f}

/* ---------- chat ---------- */
#chat{display:flex;flex-direction:column;height:100%;min-height:0;position:relative}
.ch{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--sat)) 18px 12px;border-bottom:1px solid var(--line)}
.ch .ttl{flex:1;min-width:0}
.ch .ttl b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .ttl small{color:var(--muted);font-size:13px}
.only-m{display:none}
#msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.sys{align-self:center;text-align:center;color:var(--muted);font-size:13px;padding:10px 18px;max-width:80%}
.sys.warn{color:#ffb4bd;background:#2a1a20;border-radius:14px;margin:8px 0}
.sys.call-log{background:#161d2a;border:1px solid #242e42;color:#cfd8ea;border-radius:99px;padding:6px 16px;margin:6px 0;display:inline-flex;align-items:center;gap:8px}
.day{align-self:center;color:var(--muted);font-size:12px;margin:12px 0 6px}
.row{display:flex;align-items:flex-end;gap:8px;max-width:100%;position:relative}
.row.me{flex-direction:row-reverse}
.av-sp{width:28px;flex:none}
.col{display:flex;flex-direction:column;min-width:0;max-width:min(72%,520px);position:relative}
.row.me .col{align-items:flex-end}
.nm{color:var(--muted);font-size:12px;margin:6px 0 2px 4px}
.bub-wrap{position:relative;display:flex;flex-direction:column;align-items:flex-start;max-width:100%}
.row.me .bub-wrap{align-items:flex-end}
.bub{padding:9px 15px;border-radius:20px;background:var(--other);overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px;position:relative}
.row.me .bub{background:var(--me)}
.bub.media{padding:0;background:none}
.bub.sticker{padding:4px;background:none}
.bub.gone{background:none;border:1px dashed #3a4252;color:var(--muted);font-style:italic}
.note{font-size:11px;color:var(--warn);margin:2px 6px}
.note.dim{color:var(--muted)}
.tm{font-size:11px;color:var(--muted);margin:2px 6px 6px}
.tm .rd{font-size:inherit;color:inherit;padding:0}.tm .rd.on{color:var(--accent)}
.msg-tools{display:flex;align-items:center;gap:2px;opacity:0;flex:none;margin-bottom:6px;transition:opacity .15s}
.row:hover .msg-tools{opacity:1}
@media(hover:none){.msg-tools{opacity:.8}}
.more,.react-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.more:hover,.react-btn:hover{background:var(--hover);color:var(--text)}

/* ---------- อิโมจิแสดงความคิดเห็น (Reactions) ---------- */
.rx-bar{display:flex;flex-wrap:wrap;gap:4px;margin-top:-6px;margin-bottom:2px;z-index:3;padding:0 4px}
.row.me .rx-bar{justify-content:flex-end}
.rx-chip{display:inline-flex;align-items:center;gap:4px;background:#19202e;border:1px solid #2b3548;border-radius:99px;padding:2px 8px;font-size:13px;line-height:1.3;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.28);transition:transform .12s,background .12s}
.rx-chip:hover{transform:scale(1.06);background:#222b3d}
.rx-chip.me{background:#262d52;border-color:var(--accent);color:#fff}
.rx-chip span.cnt{font-size:11px;font-weight:600;color:#cfd6e6}
.rx-chip.me span.cnt{color:#fff}
.rx-pop{position:fixed;z-index:180;background:#171e2b;border:1px solid #2a344a;border-radius:99px;padding:6px 10px;display:none;align-items:center;gap:4px;box-shadow:0 8px 28px rgba(0,0,0,.55);animation:popIn .14s ease-out}
.rx-pop.on{display:flex}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.rx-pop button{width:36px;height:36px;border-radius:50%;font-size:21px;display:grid;place-items:center;transition:transform .12s,background .12s}
.rx-pop button:hover{transform:scale(1.25);background:#232c3f}
.rx-pop button.on{background:#28325a;box-shadow:0 0 0 2px var(--accent)}
.rx-pop .rx-more{font-size:16px;color:var(--muted);background:#222a38}

/* ---------- สติ๊กเกอร์ (Stickers) ---------- */
.stk-card{width:136px;height:136px;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;transition:transform .15s}
.stk-card:hover{transform:scale(1.04)}
.stk-card svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
#stkTray{display:none;flex-direction:column;margin:0 16px 6px;background:#151b26;border:1px solid #263042;border-radius:20px;height:270px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#stkTray.on{display:flex}
.stk-tabs{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.stk-tab{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.stk-tab.on{background:var(--accent);color:#fff}
.stk-grid{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;align-content:start}
.stk-item{background:#1c2331;border:1px solid transparent;border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;transition:transform .12s,border-color .12s,background .12s}
.stk-item:hover{transform:translateY(-2px);background:#232c3d;border-color:#364461}
.stk-item svg{width:62px;height:62px}
.stk-item span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.med{position:relative;border-radius:18px;overflow:hidden;background:#111621;max-width:100%}
.med img{display:block;max-width:100%;max-height:340px;min-width:140px;min-height:100px;object-fit:cover;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.med video{display:block;max-width:100%;max-height:340px;min-width:200px;background:#000}
.med .lk{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 9px;border-radius:99px}
.lockmed{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:18px;background:#1a202b;color:var(--muted);font-size:14px;border:1px dashed #323a4a}
.lockmed .ico{font-size:22px}
audio{max-width:100%;height:42px;filter:invert(.9) hue-rotate(180deg)}
.filebox{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--other);text-align:left}
.row.me .filebox{background:var(--me)}
.filebox .ico{font-size:26px}
.filebox small{display:block;opacity:.75;font-size:12px}
.filebox b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:240px}

/* composer */
#comp{display:flex;align-items:flex-end;gap:4px;margin:6px 16px calc(12px + var(--sab));border:1px solid #2b3342;border-radius:26px;padding:6px 8px}
#comp textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:140px;min-height:40px;padding:9px 6px;line-height:1.5}
#comp textarea::placeholder{color:var(--muted)}
#comp .ib{width:40px;height:40px;font-size:23px}
#comp .send{color:var(--accent);font-weight:700;padding:0 14px;height:40px}
#comp:not(.has) .send{display:none}
#comp.has .mic{display:none}
#rec{display:none;align-items:center;gap:12px;margin:10px 16px calc(12px + var(--sab));border:1px solid var(--danger);border-radius:26px;padding:8px 14px}
#rec.on{display:flex}
#rec i{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#rec span{flex:1}
body.recording #comp{display:none}
.banner{background:#2a1a20;color:#ffb4bd;padding:10px 18px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner .pbtn{padding:6px 14px;font-size:13px}
.lockview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}
.lockview .ico{font-size:64px;color:var(--muted)}
.lockview h3{font-size:22px}
.lockview p{color:var(--muted);margin-bottom:10px}
.blankbar{padding:calc(12px + var(--sat)) 18px}
.blank{flex:1}

/* ---------- สถานะกำลังพิมพ์ ---------- */
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:#9aa6bb;animation:tp 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.ci .pv.ty{color:var(--accent);font-weight:600}
#typ:empty{display:none}
.typrow{margin-top:4px}
#chSub.ty{color:var(--accent)}

/* ---------- sheet / toast / lightbox / call ---------- */
#sbg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;opacity:0;pointer-events:none;transition:.2s}
#sbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;top:50%;width:min(480px,92vw);max-height:86dvh;overflow:auto;background:#161c27;border:1px solid #232b39;border-radius:22px;z-index:101;padding:24px 22px 20px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.2s}
#sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#sheet h3{font-size:20px;margin-bottom:4px;padding-right:36px}
#sheet .xx{position:absolute;top:14px;right:14px;width:38px;height:38px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
#sheet label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
#sheet input[type=text],#sheet input[type=password]{width:100%;background:#222a36;border:2px solid transparent;border-radius:14px;padding:12px 14px;outline:0}
#sheet input:focus{border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 10px;border-radius:12px;text-align:left;font-size:16px}
.opt:hover{background:#1e2533}
.opt .ico{font-size:22px;color:var(--muted)}
.opt.danger{color:var(--danger)}.opt.danger .ico{color:var(--danger)}
.opt small{display:block;color:var(--muted);font-size:12px}
.hr{height:1px;background:var(--line);margin:12px 0}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts .pbtn{padding:8px 16px;font-size:14px}
.reqc{background:#1b2230;border-radius:14px;padding:12px 14px;margin-top:10px}
.reqc small{color:var(--muted)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.help{color:var(--muted);font-size:12px;margin-top:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.emoji-grid button{font-size:26px;height:48px;border-radius:12px;background:#1e2533;display:grid;place-items:center}
.emoji-grid button:hover{background:#2a3448;transform:scale(1.08)}

/* ---------- ป๊อปอัปแจ้งเตือนด้านบนสำหรับมือถือ/ไอแพด (Heads-up Notification Popup) ---------- */
#pushPop{position:fixed;top:calc(10px + var(--sat));left:50%;transform:translate(-50%,-150%);width:min(440px,94vw);background:rgba(20,26,38,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #33415c;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:350;box-shadow:0 14px 36px rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.9,.3,1),opacity .22s}
#pushPop.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#pushPop .pp-body{flex:1;min-width:0;cursor:pointer}
#pushPop .pp-top{display:flex;align-items:center;gap:6px;font-size:12px;color:#93c5fd;font-weight:600}
#pushPop .pp-title{font-size:15px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pushPop .pp-txt{font-size:13px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pushPop .pp-acts{display:flex;gap:6px;flex:none}
#pushPop .pp-btn{padding:7px 12px;border-radius:10px;font-size:12px;font-weight:600;background:var(--accent);color:#fff}
#pushPop .pp-btn.ok{background:var(--ok);color:#052e16}
#pushPop .pp-btn.red{background:var(--danger);color:#fff}
#pushPop .pp-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:18px}

/* ---------- หน้าเข้าสู่ระบบ / สร้างผู้ใช้งานก่อนเริ่มแชท ---------- */
#authGate{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,#1e293b,#0b0f17 70%);z-index:280;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#authGate.on{display:flex}
.auth-card{width:min(430px,94vw);background:#151c28;border:1px solid #263147;border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.auth-head{text-align:center;margin-bottom:18px}
.auth-head img{width:64px;height:64px;border-radius:18px;margin-bottom:10px;box-shadow:0 8px 20px rgba(79,70,229,.35)}
.auth-head h2{font-size:22px;font-weight:700}
.auth-head p{font-size:13px;color:var(--muted);margin-top:4px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#0f141e;padding:4px;border-radius:14px;margin-bottom:16px;border:1px solid #222b3a}
.auth-tab{padding:9px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);text-align:center}
.auth-tab.on{background:var(--accent);color:#fff}
.auth-card label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}
.auth-card input{width:100%;background:#202836;border:2px solid transparent;border-radius:14px;padding:12px 14px;outline:0;color:var(--text)}
.auth-card input:focus{border-color:var(--accent)}
.auth-card .pbtn{width:100%;margin-top:18px;padding:13px;font-size:15px}

/* ---------- เมนูสมาชิกทั้งหมด (แอดมิน) ---------- */
.mem-card{background:#1b2230;border:1px solid #283246;border-radius:16px;padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:12px}
.mem-info{flex:1;min-width:0}
.mem-info b{display:flex;align-items:center;gap:6px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-info small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.mem-acts{display:flex;gap:6px;flex:none}
.mem-acts button{width:36px;height:36px;border-radius:10px;background:#252f42;display:grid;place-items:center;font-size:18px;color:var(--text)}
.mem-acts button:hover{background:var(--accent);color:#fff}
.mem-acts button.danger:hover{background:var(--danger);color:#fff}

function loadUsers(){
 try{USERS=JSON.parse(LS.get('chat.users')||'{}')}catch(e){USERS={}}
}
function saveUsers(){
 LS.set('chat.users',JSON.stringify(USERS));
}
function mergeUsers(map){
 if(!map||typeof map!=='object')return;
 Object.keys(map).forEach(u=>{
  if(!u||u==='*')return;
  if(!USERS[u]||((map[u].t||0)>=(USERS[u].t||0)))USERS[u]=map[u];
 });
 saveUsers();
 updateMemberCount();
}
function encodeUsersArr(){
 return Object.keys(USERS).map(u=>{
  const x=USERS[u]||{};
  return [u,x.pass||'',x.t||Date.now(),x.role||'member'].join('|');
 });
}
function decodeUsersArr(arr){
 if(!Array.isArray(arr))return;
 const map={};
 arr.forEach(s=>{
  const p=String(s||'').split('|');
  if(p[0]&&p[0]!=='*')map[p[0]]={pass:p[1]||'',t:Number(p[2])||Date.now(),role:p[3]||'member'};
 });
 mergeUsers(map);
}

  RLCH.send({type:'broadcast',event:'users-sync',payload:{users:USERS}});

function allMembersList(){
 const map=Object.assign({},USERS);
 DB.chats.forEach(c=>{
  if(c.id==='sys:users')return;
  (c.members||[]).forEach(u=>{if(u&&u!=='*'&&!map[u])map[u]={pass:'',t:0,role:'member'}});
 });
 Object.keys(DB.msgs||{}).forEach(cid=>{
  (DB.msgs[cid]||[]).forEach(m=>{if(m.from&&m.from!=='*'&&!map[m.from])map[m.from]={pass:'',t:m.t||0,role:'member'}});
 });
 if(ME&&!map[ME])map[ME]={pass:'',t:Date.now(),role:ADMIN?'admin':'member'};
 return Object.keys(map).sort().map(u=>{
  let msgCnt=0;
  Object.keys(DB.msgs||{}).forEach(cid=>{(DB.msgs[cid]||[]).forEach(m=>{if(m.from===u)msgCnt++})});
  return {u:u,pass:map[u].pass||'',t:map[u].t||0,role:(u===ME&&ADMIN)||map[u].role==='admin'?'admin':'member',msgs:msgCnt};
 });
}

function playDing(){
 if(!NSOUND)return;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  if(!ACTX)ACTX=new Ctx();
  if(ACTX.state==='suspended')ACTX.resume().catch(()=>{});
  const o=ACTX.createOscillator(),g=ACTX.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(587.33,ACTX.currentTime);
  o.frequency.setValueAtTime(880,ACTX.currentTime+0.09);
  g.gain.setValueAtTime(0.08,ACTX.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ACTX.currentTime+0.35);
  o.connect(g);g.connect(ACTX.destination);
  o.start();o.stop(ACTX.currentTime+0.36);
 }catch(e){}
}

    });

   }else{

  }catch(e){
   if(navigator.serviceWorker&&navigator.serviceWorker.ready){

   }
  }
 }
}

function onChatRow(r){

 if(i>-1)a[i]=m;else{a.push(m);a.sort((x,y)=>x.t-y.t)}

   notifyUser(sender,pvText(m).replace(/^คุณ:\s*/,''),r.chat_id,false);

 }

async function loadCloud(){
 const [c,m,rr]=await Promise.all([sb.from('chat_rooms').select('*'),sb.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(1000),sb.from('chat_reads').select('msg_id,user_name,read_at').order('read_at',{ascending:false}).limit(5000)]);
 if(c.error||m.error)throw(c.error||m.error);
 const sysU=(c.data||[]).find(r=>r.id==='sys:users');
 if(sysU)decodeUsersArr(sysU.members);
 DB.chats=(c.data||[]).filter(r=>r.id!=='sys:users').map(rowToChat);DB.msgs={};
 if(!DB.chats.length){
  const mainRoom={id:'room-main',type:'group',name:'ห้องแชทรวม',members:['*'],closed:false,silent:false};
  DB.chats.push(mainRoom);cloudChat(mainRoom);
 }
 m.data.reverse().forEach(r=>msgsOf(r.chat_id).push(rowToMsg(r)));
 (rr.data||[]).forEach(r=>{(RCPT[r.msg_id]=RCPT[r.msg_id]||{})[r.user_name]=new Date(r.read_at).getTime()});
 updateMemberCount();refresh();
}
function cloudInit(){
 RLCH=sb.channel('chat-rt',{config:{broadcast:{self:false,ack:false}}})
  .on('postgres_changes',{event:'*',schema:'public',table:'chat_rooms'},p=>p.eventType==='DELETE'?dropChat((p.old||{}).id):onChatRow(p.new))
  .on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},p=>onMsgRow(p.new))
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_reads'},p=>onReadRow(p.new))
  .on('broadcast',{event:'typing'},e=>{const d=e.payload||{};if(d.chat&&d.from)typingSet(d.chat,d.from,!!d.on)})
  .on('broadcast',{event:'react'},e=>{onReactPayload(e.payload)})
  .on('broadcast',{event:'users-sync'},e=>{if(e.payload&&e.payload.users){mergeUsers(e.payload.users);if($('#sheet.on')&&$('#memSearch'))membersSheet()}})
  .on('broadcast',{event:'sig'},e=>onSigMsg(e.payload))
  .subscribe(async st=>{
   if(st==='SUBSCRIBED'){try{await loadCloud();rt('on')}catch(e){rt('err',e.message);toast('เชื่อมต่อฐานข้อมูลไม่ได้: '+(e.message||e))}}
   else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')rt('err',st);
   else if(st==='CLOSED')rt('err','หลุดการเชื่อมต่อ');
  });
}

function markRead(){

const TYPING={};

let TLAST=0,TOFF=null;const TCLR={};
function typers(cid){const o=TYPING[cid]||{},n=Date.now();return Object.keys(o).filter(u=>u!==ME&&o[u]>n)}
function subText(c){
 const t=typers(c.id);
 if(t.length&&!(c.closed&&!ADMIN))return c.type==='dm'?'กำลังพิมพ์...':t.join(', ')+' กำลังพิมพ์...';

function updateTypingBubble(scroll){

 const s=$('#chSub');if(s){s.textContent=subText(c);s.classList.toggle('ty',t.length>0)}

}
function typingSet(cid,user,on){
 if(user===ME)return;
 const o=TYPING[cid]||(TYPING[cid]={}),key=cid+'|'+user;
 clearTimeout(TCLR[key]);
 if(on){o[user]=Date.now()+4000;TCLR[key]=setTimeout(()=>typingSet(cid,user,false),4100)}else delete o[user];
 renderList();if(cid===OPEN)updateTypingBubble(true);
}
function typingPing(on){
 if(!(CLOUD?RLCH:TYPC)||!OPEN)return;
 const c=chatById(OPEN);if(!c||(c.closed&&!ADMIN))return;
 const p={chat:OPEN,from:ME,on:on};if(CLOUD)RLCH.send({type:'broadcast',event:'typing',payload:p});else TYPC.postMessage(p);
}
function typingInput(hasText){
 if(!hasText){clearTimeout(TOFF);if(TLAST){TLAST=0;typingPing(false)}return}
 const n=Date.now();
 if(n-TLAST>2000){TLAST=n;typingPing(true)}
 clearTimeout(TOFF);TOFF=setTimeout(()=>{TLAST=0;typingPing(false)},3000);
}

let REC=null,RCH=[],RSTREAM=null,RT=null,RT0=0,RSEND=false;
async function recStart(){
 if(!canSend())return;
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('อุปกรณ์นี้ไม่รองรับการบันทึกเสียง');
 try{RSTREAM=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('ไม่ได้รับอนุญาตใช้ไมโครโฟน')}
 RCH=[];RSEND=false;REC=new MediaRecorder(RSTREAM);
 REC.ondataavailable=e=>{if(e.data&&e.data.size)RCH.push(e.data)};
 REC.onstop=async()=>{
  RSTREAM.getTracks().forEach(t=>t.stop());clearInterval(RT);
  document.body.classList.remove('recording');const r=$('#rec');if(r)r.classList.remove('on');
  if(RSEND&&RCH.length){const b=new Blob(RCH,{type:REC.mimeType||'audio/webm'});await sendFile(new File([b],'voice-'+Date.now()+'.'+((REC.mimeType||'').includes('mp4')?'m4a':'webm'),{type:b.type}))}
  REC=null;
 };
 REC.start();RT0=Date.now();document.body.classList.add('recording');$('#rec').classList.add('on');
 RT=setInterval(()=>{const s=Math.floor((Date.now()-RT0)/1000);const e=$('#recT');if(e)e.textContent=Math.floor(s/60)+':'+pad(s%60)},250);
}
function recStop(send){if(!REC)return;RSEND=send;try{REC.stop()}catch(e){}}

function setClosed(id,closed,silent){

// ===================== โทร & เสียงเรียกเข้า (WebRTC + Web Audio) =====================
const SIG=('BroadcastChannel' in window)?new BroadcastChannel('chat-sig'):null;
let PC=null,LOC=null,CALL=null,PEND=[],CT=null,CT0=0,RING=null,OFF_RPT=null,FACING='user';
let ACTX=null,TONE_T=null;

function playTone(mode){
 stopTone();
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  if(!ACTX)ACTX=new Ctx();
  if(ACTX.state==='suspended')ACTX.resume().catch(()=>{});
  const beep=()=>{
   if(!CALL||CALL.connected)return;
   const o=ACTX.createOscillator(),g=ACTX.createGain();
   o.type='sine';
   o.frequency.setValueAtTime(mode==='in'?523.25:440,ACTX.currentTime);
   if(mode==='in')o.frequency.setValueAtTime(659.25,ACTX.currentTime+0.18);
   g.gain.setValueAtTime(0.08,ACTX.currentTime);
   g.gain.exponentialRampToValueAtTime(0.001,ACTX.currentTime+0.45);
   o.connect(g);g.connect(ACTX.destination);
   o.start();o.stop(ACTX.currentTime+0.46);
  };
  beep();
  TONE_T=setInterval(beep,mode==='in'?1400:2200);
 }catch(e){}
}
function stopTone(){if(TONE_T){clearInterval(TONE_T);TONE_T=null}}

function sig(o){
 const p=Object.assign({from:ME},o);
 if(CLOUD&&RLCH)RLCH.send({type:'broadcast',event:'sig',payload:p});
 if(SIG)SIG.postMessage(p);
}
function callUI(state,name,video){
 $('#call').classList.add('on');
 $('#cav').innerHTML=av(name,96);$('#cn').textContent=name;
 $('#cst').textContent=state==='in'?(video?'วิดีโอคอลเรียกเข้า...':'สายเรียกเข้า...'):state==='out'?(video?'กำลังโทรวิดีโอ...':'กำลังโทรด้วยเสียง...'):'';
 $('#cAcc').classList.toggle('hide',state!=='in');
 $('#cMic').classList.toggle('hide',state==='in');
 $('#cSpk').classList.toggle('hide',state==='in');
 $('#cCam').classList.toggle('hide',state==='in'||!video);
 $('#cFlip').classList.toggle('hide',state==='in'||!video);
 $('#cMic').classList.remove('off');$('#cSpk').classList.remove('off');$('#cCam').classList.remove('off');
}
function makeFallbackStream(){
 const Ctx=window.AudioContext||window.webkitAudioContext;
 if(!ACTX)ACTX=new Ctx();
 if(ACTX.state==='suspended')ACTX.resume().catch(()=>{});
 const dst=ACTX.createMediaStreamDestination();
 const osc=ACTX.createOscillator(),gain=ACTX.createGain();
 gain.gain.value=0;osc.connect(gain);gain.connect(dst);osc.start();
 return dst.stream;
}
async function getCallStream(video){
 if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
  try{
   return await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
    video:video?{facingMode:FACING,width:{ideal:640},height:{ideal:480}}:false
   });
  }catch(e){
   if(video){
    try{
     const s=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
     toast('ไม่สามารถเปิดกล้องได้ สลับเป็นการโทรด้วยเสียงอัตโนมัติ');
     if(CALL)CALL.video=false;
     return s;
    }catch(_){}
   }
  }
 }
 toast('เปิดโหมดเชื่อมต่อสายสำรอง (ไม่ได้เปิดสิทธิ์ไมค์บนเบราว์เซอร์นี้)');
 return makeFallbackStream();
}
async function mkPC(video){
 if(!window.RTCPeerConnection)throw Error('อุปกรณ์ไม่รองรับ WebRTC');
 LOC=await getCallStream(video);
 const hasVid=LOC.getVideoTracks().length>0;
 $('#lv').srcObject=hasVid?LOC:null;$('#lv').style.display=hasVid?'block':'none';
 PC=new RTCPeerConnection({iceServers:ICE});
 LOC.getTracks().forEach(t=>PC.addTrack(t,LOC));
 PC.ontrack=e=>{
  const st=(e.streams&&e.streams[0])||new MediaStream([e.track]);
  const rv=$('#rv'),ra=$('#ra');
  if(rv){rv.srcObject=st;rv.muted=false;rv.play().catch(()=>{})}
  if(ra){ra.srcObject=st;ra.muted=false;ra.play().catch(()=>{})}
 };
 PC.onicecandidate=e=>{if(e.candidate&&CALL)sig({t:'ice',to:CALL.peer,chat:CALL.chat,c:e.candidate.toJSON?e.candidate.toJSON():e.candidate})};
 PC.onconnectionstatechange=()=>{
  if(!PC)return;
  if(PC.connectionState==='connected'&&CALL&&!CALL.connected)connected();
  if(['failed','closed'].includes(PC.connectionState))endCall(false);
 };
}
async function startCall(video){
 const c=chatById(OPEN);if(!c)return;
 if(c.closed&&!ADMIN)return toast('แชทถูกปิด โทรไม่ได้');
 if(CALL)return;
 if(!SIG&&!CLOUD)return toast('เบราว์เซอร์ไม่รองรับการโทรในโหมดนี้');
 const target=c.type==='dm'?peerOf(c):'*';
 const title=chatName(c);
 FACING='user';
 CALL={id:uid(),chat:c.id,peer:target,title:title,video:video,out:true,connected:false};PEND=[];
 callUI('out',title,video);
 playTone('out');
 try{
  await mkPC(video);
  const off=await PC.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:!!video});
  await PC.setLocalDescription(off);
  const sendOff=()=>sig({t:'offer',cid:CALL.id,to:target,chat:c.id,title:c.type==='group'?c.name:ME,video:CALL.video,sdp:{type:PC.localDescription.type,sdp:PC.localDescription.sdp}});
  sendOff();
  clearInterval(OFF_RPT);
  OFF_RPT=setInterval(()=>{if(CALL&&CALL.out&&!CALL.connected&&PC&&PC.localDescription)sendOff()},3200);
  RING=setTimeout(()=>{if(CALL&&!CALL.connected){addMsg(CALL.chat,{type:'system',text:(CALL.video?'วิดีโอคอล':'การโทร')+'ไม่มีผู้รับสาย'});endCall(true);refresh()}},45000);
 }catch(e){toast(e.message||'เริ่มการโทรไม่สำเร็จ');endCall(false)}
}
async function acceptCall(){
 closePop();
 if(!CALL||CALL.out)return;
 stopTone();
 $('#cst').textContent='กำลังเชื่อมต่อสัญญาณ...';
 try{
  await mkPC(CALL.video);
  await PC.setRemoteDescription(new RTCSessionDescription(CALL.offer));
  for(const c of PEND)try{await PC.addIceCandidate(new RTCIceCandidate(c))}catch(e){}PEND=[];
  const ans=await PC.createAnswer();await PC.setLocalDescription(ans);
  sig({t:'answer',to:CALL.peer,chat:CALL.chat,sdp:{type:PC.localDescription.type,sdp:PC.localDescription.sdp}});
  connected();
 }catch(e){toast(e.message||'รับสายไม่สำเร็จ');endCall(true)}
}
function connected(){
 stopTone();closePop();
 clearInterval(OFF_RPT);OFF_RPT=null;
 if(!CALL||CALL.connected)return;
 CALL.connected=true;clearTimeout(RING);CT0=Date.now();
 $('#cAcc').classList.add('hide');
 $('#cMic').classList.remove('hide');$('#cSpk').classList.remove('hide');
 if(CALL.video){$('#cCam').classList.remove('hide');$('#cFlip').classList.remove('hide')}
 clearInterval(CT);CT=setInterval(()=>{const s=Math.floor((Date.now()-CT0)/1000);$('#cst').textContent=pad(Math.floor(s/60))+':'+pad(s%60)},500);
 $('#cst').textContent='00:00';
}
async function flipCam(){
 if(!CALL||!CALL.video||!LOC)return;
 FACING=FACING==='user'?'environment':'user';
 try{
  const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:FACING}});
  const nt=ns.getVideoTracks()[0];
  const old=LOC.getVideoTracks()[0];
  if(old){LOC.removeTrack(old);old.stop()}
  LOC.addTrack(nt);
  $('#lv').srcObject=LOC;
  $('#lv').style.transform=FACING==='user'?'scaleX(-1)':'none';
  if(PC){const sender=PC.getSenders().find(s=>s.track&&s.track.kind==='video');if(sender)await sender.replaceTrack(nt)}
 }catch(e){toast('สลับกล้องไม่ได้บนอุปกรณ์นี้')}
}
function endCall(send){
 stopTone();closePop();
 clearInterval(OFF_RPT);OFF_RPT=null;
 if(send&&CALL)sig({t:'end',to:CALL.peer,chat:CALL.chat});
 clearTimeout(RING);clearInterval(CT);
 const was=CALL;
 if(LOC)LOC.getTracks().forEach(t=>t.stop());LOC=null;
 if(PC){try{PC.close()}catch(e){}}PC=null;
 $('#rv').srcObject=null;$('#ra').srcObject=null;$('#lv').srcObject=null;$('#call').classList.remove('on');
 if(was&&was.connected&&was.out){
  const s=Math.floor((Date.now()-CT0)/1000);
  addMsg(was.chat,{type:'system',text:(was.video?'วิดีโอคอล':'การโทรด้วยเสียง')+'สิ้นสุด ('+pad(Math.floor(s/60))+':'+pad(s%60)+')'});
  refresh();
 }
 CALL=null;PEND=[];
}
const onSigMsg=async d=>{
 d=d||{};if(!ME||!AUTH_OK||d.from===ME)return;
 let c=d.chat?chatById(d.chat):null;
 if(!c&&d.chat&&d.chat.startsWith('dm:')&&d.chat.split('|').includes(ME)){
  c={id:d.chat,type:'dm',name:'',members:[ME,d.from],closed:false,silent:false};
  DB.chats.push(c);msgsOf(c.id);save();renderList();
 }
 const isForMe=d.to===ME||(d.to==='*'&&c&&(c.members.includes('*')||c.members.includes(ME)));
 if(!isForMe)return;
 if(d.t==='offer'){
  if(CALL&&CALL.cid===d.cid)return; // ข้าม offer ซ้ำจากสายเดิม
  if(CALL||!c||(c.closed&&!ADMIN)){if(d.to===ME)sig({t:'end',to:d.from,chat:d.chat});return}
  CALL={cid:d.cid||uid(),chat:d.chat,peer:d.from,title:d.title||d.from,video:d.video,offer:d.sdp,out:false,connected:false};PEND=[];
  callUI('in',CALL.title,d.video);
  playTone('in');
  sig({t:'ringing',to:d.from,chat:d.chat});
  notifyUser('📞 '+CALL.title,d.video?'มีวิดีโอคอลเรียกเข้า... กดเพื่อรับสาย':'มีสายเรียกเข้า... กดเพื่อรับสาย',d.chat,true);
 }else if(d.t==='ringing'&&CALL&&CALL.out&&!CALL.connected){
  $('#cst').textContent=CALL.video?'กำลังเรียกสายวิดีโอ (ปลายทางกำลังดัง)...':'กำลังเรียกสาย (ปลายทางกำลังดัง)...';
 }else if(d.t==='answer'&&PC&&CALL&&CALL.out){
  CALL.peer=d.from;
  try{
   await PC.setRemoteDescription(new RTCSessionDescription(d.sdp));
   for(const c of PEND)try{await PC.addIceCandidate(new RTCIceCandidate(c))}catch(e){}
   PEND=[];connected();
  }catch(e){}
 }else if(d.t==='ice'&&CALL&&(d.from===CALL.peer||CALL.peer==='*')){
  if(PC&&PC.remoteDescription&&PC.remoteDescription.type){try{await PC.addIceCandidate(new RTCIceCandidate(d.c))}catch(e){}}else PEND.push(d.c);
 }else if(d.t==='end'&&CALL){
  const w=CALL;toast(w.connected?'อีกฝ่ายวางสาย':w.out?'อีกฝ่ายไม่รับสาย':'สายเรียกเข้าถูกยกเลิก');endCall(false);
 }
};
if(SIG)SIG.onmessage=ev=>onSigMsg(ev.data);

    const last=ms[ms.length-1];
    const c=chatById(cid);
    if(last&&last.from&&last.from!==ME&&last.type!=='system'&&c&&!(c.closed&&!ADMIN)&&(c.members.includes('*')||c.members.includes(ME))){
     const sender=c.type==='group'?chatName(c)+' ('+last.from+')':last.from;
     notifyUser(sender,pvText(last).replace(/^คุณ:\s*/,''),cid,false);
    }
   }
  });
 }
 if(e.key==='chat.users'){loadUsers();updateMemberCount();if($('#sheet.on')&&$('#memSearch'))membersSheet()}
 if(e.key==='chat.reacts'){loadReacts();if(OPEN)renderMsgs(false)}
 if(e.key==='chat.read.'+ME)loadRead();
});
