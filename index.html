<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f5bf5'><path d='M4 5h16v11H9l-5 4z'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f5bf5'><path d='M4 5h16v11H9l-5 4z'/></svg>">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="แชท">
<title>ระบบแชทความปลอดภัยสูง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0f17;--line:#1d232e;--hover:#141a24;--sel:#1b2230;--text:#f1f4f9;--muted:#8b95a7;
  --me:#4f46e5;--other:#232a36;--accent:#4f5bf5;--danger:#ff5a6a;--ok:#2ecc71;--warn:#ffb020;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Prompt',sans-serif;overflow:hidden;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;font-size:16px;color:var(--text)}
.hide{display:none!important}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em;flex:none}

/* Layout */
#app{display:grid;grid-template-columns:76px 360px 1fr;height:100dvh;transition:filter .15s}
#app.shield{filter:blur(22px)}
#rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(18px + var(--sat)) 0 calc(18px + var(--sab));border-right:1px solid var(--line)}
#rail .rb{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px}
#rail .rb:hover{background:var(--hover)}#rail .rb.on{background:var(--sel)}
#rail .sp{flex:1}
#side{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);height:100dvh}
#main{display:flex;flex-direction:column;min-width:0;height:100dvh;position:relative}

/* Side List */
.s-head{display:flex;align-items:center;gap:10px;padding:calc(18px + var(--sat)) 20px 8px}
.uname{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;min-width:0}
.uname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm{background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px}
.rt{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.rt.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.rt.err{background:var(--danger)}
.s-head .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.ib:hover{background:var(--hover)}
.searchbox{margin:8px 16px 6px;display:flex;align-items:center;gap:10px;background:#222a36;border-radius:99px;padding:0 16px;height:46px;color:var(--muted)}
.searchbox input{flex:1;background:none;border:0;outline:0}
.s-sub{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;font-size:14px}
.dotn{min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
#clist{flex:1;overflow-y:auto;padding:4px 8px calc(20px + var(--sab))}
.ci{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;text-align:left}
.ci:hover{background:var(--hover)}.ci.on{background:var(--sel)}
.ci .tx{flex:1;min-width:0}
.ci .tt{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px}
.ci .pv{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.un .pv,.ci.un .tt{color:var(--text);font-weight:700}
.ci .un-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.tg{font-size:10px;padding:1px 6px;border-radius:99px;background:#3a2330;color:#ff9aa8}
.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;overflow:hidden}

/* Chat View */
#empty{margin:auto;text-align:center;padding:20px}
#empty .circ{width:84px;height:84px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:38px;margin:0 auto 16px}
#chat{display:flex;flex-direction:column;height:100%;min-height:0}
.ch{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--sat)) 16px 12px;border-bottom:1px solid var(--line)}
.ch .ttl{flex:1;min-width:0}
.ch .ttl b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .ttl small{color:var(--muted);font-size:12px}
.only-m{display:none}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.sys{align-self:center;text-align:center;color:var(--muted);font-size:12px;padding:6px 14px}
.sys.warn{color:#ffb4bd;background:#2a1a20;border-radius:12px;margin:6px 0}
.day{align-self:center;color:var(--muted);font-size:11px;margin:10px 0 4px}
.row{display:flex;align-items:flex-end;gap:6px;max-width:100%;position:relative}
.row.me{flex-direction:row-reverse}
.col{display:flex;flex-direction:column;min-width:0;max-width:min(75%,520px)}
.row.me .col{align-items:flex-end}
.nm{color:var(--muted);font-size:11px;margin:4px 0 2px 4px}
.bub{padding:8px 14px;border-radius:18px;background:var(--other);overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
.row.me .bub{background:var(--me)}
.bub.media{padding:0;background:none}
.bub.gone{background:none;border:1px dashed #3a4252;color:var(--muted);font-style:italic}
.note{font-size:11px;color:var(--warn);margin:2px 4px}
.note.dim{color:var(--muted)}

/* Reaction System */
.msg-reaction-container{display:flex;gap:4px;flex-wrap:wrap;margin:4px 4px 2px}
.row.me .msg-reaction-container{justify-content:flex-end}
.msg-reaction-badge{background:#1b2230;border:1px solid #2b3342;border-radius:99px;padding:1px 7px;font-size:12px;line-height:20px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.msg-reaction-badge.mine{border-color:var(--accent);background:rgba(79,91,245,.2)}
.reaction-picker-trigger{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .15s;flex:none;margin-bottom:6px}
.row:hover .reaction-picker-trigger{opacity:1}
@media(hover:none){.reaction-picker-trigger{opacity:.7}}
.rx-popover{position:absolute;background:#181f2c;border:1px solid #2b3548;border-radius:99px;padding:4px 8px;display:flex;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:90;bottom:calc(100% + 4px)}
.row.me .rx-popover{right:0}.row.ot .rx-popover{left:32px}
.rx-popover button{font-size:20px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.rx-popover button:hover{background:rgba(255,255,255,.1)}

/* Song Player Card */
.song-card{background:#181f2a;border:1px solid #2a3446;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:240px;max-width:320px}
.song-header{display:flex;align-items:center;gap:10px}
.song-cover{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#4f5bf5,#e11d48);display:grid;place-items:center;font-size:20px;flex:none}
.song-info{flex:1;min-width:0}
.song-title{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-size{font-size:11px;color:var(--muted)}
.song-controls{display:flex;align-items:center;gap:8px}
.song-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.song-track{flex:1;height:4px;background:#2b3445;border-radius:99px;position:relative;cursor:pointer}
.song-bar{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:99px;width:0%}
.song-time{font-size:11px;color:var(--muted);min-width:30px;text-align:right}

/* Stickers & Media */
.stk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.06);border:2px dashed var(--c)}
.stk .e{font-size:52px;line-height:1.15}.stk b{color:#fff;font-size:16px}
.stkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stkgrid button{display:block}
.tm{font-size:11px;color:var(--muted);margin:2px 4px 4px}
.tm .rd.on{color:var(--accent)}
.more{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0;flex:none;margin-bottom:6px}
.row:hover .more{opacity:1}
.med img,.med video{display:block;max-width:100%;max-height:300px;border-radius:16px;object-fit:cover}

/* Composer */
#comp{display:flex;align-items:flex-end;gap:4px;margin:8px 14px calc(10px + var(--sab));border:1px solid #2b3342;border-radius:24px;padding:5px 6px}
#comp textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:130px;min-height:36px;padding:7px 6px;line-height:1.4}
#comp .send{color:var(--accent);font-weight:700;padding:0 12px;height:36px}
#comp:not(.has) .send{display:none}
#comp.has .mic{display:none}
#rec{display:none;align-items:center;gap:10px;margin:8px 14px calc(10px + var(--sab));border:1px solid var(--danger);border-radius:24px;padding:6px 12px}
#rec.on{display:flex}
#rec i{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#rec span{flex:1}

/* Modals & UI */
#sbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;pointer-events:none;transition:.2s}
#sbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;top:50%;width:min(440px,92vw);max-height:86dvh;overflow:auto;background:#161c27;border:1px solid #232b39;border-radius:20px;z-index:101;padding:20px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.2s}
#sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#sheet .xx{position:absolute;top:14px;right:14px;width:32px;height:32px;font-size:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-radius:10px;text-align:left;font-size:15px}
.opt:hover{background:#1e2533}
.pbtn{background:var(--accent);color:#fff;font-weight:600;padding:9px 18px;border-radius:10px}
.pbtn.ghost{background:#222a36}.pbtn.ok{background:var(--ok);color:#06210f}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translate(-50%,16px);background:#e8ecf3;color:#0b0f17;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:300}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain}

/* Responsive */
@media(max-width:760px){
  #app{grid-template-columns:1fr}#rail,#main{display:none}
  body.chat-open #side{display:none}body.chat-open #main{display:flex}
  .only-m{display:grid}
}
</style>
</head>
<body>

<div id="app">
  <nav id="rail" aria-label="เมนู">
    <div class="logo" id="logoI"></div>
    <button class="rb on" data-act="home" id="rbChat"></button>
    <button class="rb" data-act="focusSearch" id="rbSearch"></button>
    <button class="rb" data-act="newChat" id="rbNew"></button>
    <button class="rb" data-act="requests" id="rbAdm"></button>
    <div class="sp"></div>
    <button class="rb" data-act="settings" id="rbSet"></button>
  </nav>

  <section id="side">
    <div class="s-head">
      <button class="uname" data-act="settings"><b id="uname"></b><span id="unameC"></span></button>
      <span class="adm hide" id="admTag">แอดมิน</span>
      <button class="rt hide" id="rtDot" data-act="cloudSheet"></button>
      <span class="sp"></span>
      <button class="ib" data-act="newChat" id="btnNew"></button>
    </div>
    <div class="searchbox"><span id="srI"></span><input id="cs" placeholder="ค้นหา" autocomplete="off"></div>
    <div class="s-sub"><b>ข้อความ</b><button data-act="requests">คำขอ <span class="dotn hide" id="reqN"></span></button></div>
    <div id="clist"></div>
  </section>

  <section id="main">
    <div id="empty">
      <div class="circ" id="emI"></div>
      <h2>ข้อความของคุณ</h2>
      <p>ส่งรูปภาพ เสียง เพลง สติกเกอร์ และข้อความส่วนตัว</p>
      <button class="pbtn" data-act="newChat">ส่งข้อความ</button>
    </div>
    <div id="chat" class="hide"></div>
  </section>
</div>

<input type="file" id="fi1" accept="image/*,video/*" multiple hidden>
<input type="file" id="fi2" multiple hidden>
<input type="file" id="fi_song" accept="audio/*" hidden>

<div id="sbg" data-act="closeSheet"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="lb"><button data-act="closeLb" id="lbX"></button><img id="lbImg" alt=""></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
const ADMIN_PIN = '123456';
const MAX_FILE = 100 * 1024 * 1024;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const LS = {
  get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } }
};
const SS = {
  get: k => { try { return sessionStorage.getItem(k); } catch(e) { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch(e) {} },
  del: k => { try { sessionStorage.removeItem(k); } catch(e) {} }
};

// Supabase Realtime Config
const SB_URL = 'https://iejmwihipfvtkbvjtude.supabase.co' || LS.get('chat.sb.url') || '';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imllam13aWhpcGZ2dGtidmp0dWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzQ0MzksImV4cCI6MjEwNjI1MDQzOX0.jR6txR7ztk_iKiF6-oxjkilpVllajLN3koIPNA5uBUY' || LS.get('chat.sb.key') || '';
const CLOUD = !!(SB_URL && SB_KEY && window.supabase && window.supabase.createClient);
let ATOKEN = SS.get('chat.atoken') || '';

const sb = CLOUD ? window.supabase.createClient(SB_URL, SB_KEY, {
  auth: { persistSession: false, autoRefreshToken: false },
  global: { fetch: (u, o) => { const h = new Headers((o && o.headers) || {}); if (ATOKEN) h.set('x-admin-token', ATOKEN); return fetch(u, Object.assign({}, o, { headers: h })); } }
}) : null;

let DB = { chats:[], msgs:{} }, ME = LS.get('chat.me') || '', ADMIN = SS.get('chat.admin') === '1', OPEN = null, FRAME = '', FILTER = '';
let BLUR = LS.get('chat.blur') !== '0', READ = {}, RLCH = null, DEFERRED_PROMPT = null;

const IC = {
  chat:'<path d="M4 5h16v11H9l-5 4z"/>', smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a4.5 4.5 0 0 0 8 0M9 9.5v.01M15 9.5v.01"/>',
  bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  compose:'<path d="M12 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M18 3l3 3-9 9-4 1 1-4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', chev:'<path d="M6 9l6 6 6-6"/>', back:'<path d="M15 5l-7 7 7 7"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
  clip:'<path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/>',
  music:'<path d="M9 18V5l12-2v13M9 10l12-2M9 18a3 3 0 1 1-6-3 3 3 0 0 1 6 3zm12-2a3 3 0 1 1-6-3 3 3 0 0 1 6 3z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  check:'<path d="M5 12l5 5 9-10"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',
  eyeoff:'<path d="M3 3l18 18M10.5 5.2A9 9 0 0 1 12 5c5 0 9 4.5 10 7a12 12 0 0 1-3 4"/>',
  file:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>', download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>'
};
const I = n => `<svg class="ico" viewBox="0 0 24 24">${IC[n]||''}</svg>`;

const chatById = id => DB.chats.find(c => c.id === id);
const msgsOf = id => DB.msgs[id] || (DB.msgs[id] = []);
const peerOf = c => c.members.find(x => x !== ME) || ME;
const chatName = c => c.type === 'dm' ? peerOf(c) : c.name;
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
const dayLbl = t => dayKey(t) === dayKey(Date.now()) ? 'วันนี้' : new Date(t).getDate() + ' ' + TH[new Date(t).getMonth()];
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2500); };

// Storage & Data Mapping
const rowToChat = r => ({ id:r.id, type:r.type, name:r.name || '', members:r.members || [], closed:!!r.closed, silent:!!r.silent, closedBy:r.closed_by || '', delReq:r.del_req || '', delBy:r.del_by || '' });
const rowToMsg = r => ({ id:r.id, t:new Date(r.created_at).getTime(), type:r.type, text:r.body || '', from:r.from_user || undefined, mid:r.media_path || undefined, mime:r.mime || '', name:r.file_name || '', size:r.size || 0, locked:!!r.locked, unsend:r.unsend || undefined, warn:r.warn ? 1 : undefined });
const msgToRow = (cid, m) => ({ id:m.id, chat_id:cid, type:m.type, from_user:m.from || null, body:m.text || null, media_path:m.mid || null, mime:m.mime || null, file_name:m.name || null, size:m.size || null, warn:!!m.warn });

function load(){
  if (CLOUD) return;
  try { const d = JSON.parse(LS.get('chat.db') || 'null'); if (d && d.chats) DB = d; } catch(e) {}
  if (!DB.msgs) DB.msgs = {};
  if (!DB.chats.length) {
    DB.chats.push({ id:'room-main', type:'group', name:'ห้องแชทรวม', members:['*'], closed:false });
    DB.msgs['room-main'] = [{ id:uid(), t:Date.now(), type:'system', text:'ยินดีต้อนรับสู่ห้องแชทรวม' }];
  }
}
function save(){ if (!CLOUD) LS.set('chat.db', JSON.stringify(DB)); }

function addMsg(cid, m){
  const x = Object.assign({ id:uid(), t:Date.now() }, m);
  msgsOf(cid).push(x);
  if (CLOUD) sb.from('chat_messages').insert(msgToRow(cid, x)).then(r => { if (r.error) toast(r.error.message); });
  else save();
  return x;
}

// Media Cache
let _idb;
const idb = () => _idb || (_idb = new Promise((res, rej) => {
  const r = indexedDB.open('chat-media', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('m');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const putBlob = (k, b) => idb().then(d => new Promise((res, rej) => { const t = d.transaction('m', 'readwrite'); t.objectStore('m').put(b, k); t.oncomplete = res; t.onerror = rej; }));
const getBlob = k => idb().then(d => new Promise((res, rej) => { const q = d.transaction('m').objectStore('m').get(k); q.onsuccess = () => res(q.result); q.onerror = rej; }));
const URLS = {};
async function urlFor(mid){
  if (URLS[mid]) return URLS[mid];
  if (CLOUD) { const r = await sb.storage.from('chat-media').createSignedUrl(mid, 86400); return r.data ? (URLS[mid] = r.data.signedUrl) : null; }
  const b = await getBlob(mid); return b ? (URLS[mid] = URL.createObjectURL(b)) : null;
}
function hydrate(root){
  root.querySelectorAll('[data-mid]').forEach(el => {
    if (el.dataset.ok) return;
    urlFor(el.dataset.mid).then(u => { if (u) { el.src = u; el.dataset.ok = '1'; } });
  });
}

// Reactions
const RX = {}, RE = ['❤️','👍','😂','😮','😢','🙏'];
const rxOf = m => CLOUD ? (RX[m.id] || {}) : (m.rx || {});
function rxHtml(m){
  const r = rxOf(m), us = Object.keys(r); if (!us.length) return '';
  const g = {}; us.forEach(u => (g[r[u]] = g[r[u]] || []).push(u));
  return '<div class="msg-reaction-container">' + Object.keys(g).map(e => {
    return `<button class="msg-reaction-badge ${g[e].includes(ME)?'mine':''}" data-act="toggleReact" data-id="${esc(m.id)}" data-e="${esc(e)}">${e} <b>${g[e].length}</b></button>`;
  }).join('') + '</div>';
}
function applyReaction(msgId, emoji){
  const c = chatById(OPEN), m = c && msgsOf(c.id).find(x => x.id === msgId);
  if (!m || !ME || (c.closed && !ADMIN)) return;
  const cur = rxOf(m)[ME];
  if (CLOUD) {
    const box = RX[msgId] = RX[msgId] || {};
    if (cur === emoji) { delete box[ME]; sb.from('chat_reactions').delete().eq('msg_id', msgId).eq('user_name', ME); }
    else { box[ME] = emoji; sb.from('chat_reactions').upsert({ msg_id: msgId, chat_id: c.id, user_name: ME, emoji: emoji }); }
  } else {
    m.rx = m.rx || {}; if (cur === emoji) delete m.rx[ME]; else m.rx[ME] = emoji; save();
  }
  const pop = $('.rx-popover'); if (pop) pop.remove();
  renderMsgs(false);
}

// Music Player
const PLAYING = {};
function togglePlaySong(msgId){
  const a = $(`#audio-${msgId}`), btn = $(`#btn-play-${msgId}`), bar = $(`#pbar-${msgId}`), time = $(`#time-${msgId}`);
  if (!a) return;
  Object.keys(PLAYING).forEach(id => { if (id !== msgId && PLAYING[id]) { PLAYING[id].pause(); const b = $(`#btn-play-${id}`); if (b) b.textContent = '▶'; } });
  if (a.paused) {
    a.play().then(() => { btn.textContent = '⏸'; PLAYING[msgId] = a; }).catch(() => toast('เล่นเพลงไม่สำเร็จ'));
  } else { a.pause(); btn.textContent = '▶'; }
  if (!a.dataset.ready) {
    a.dataset.ready = '1';
    a.addEventListener('timeupdate', () => {
      const pct = (a.currentTime / (a.duration || 1)) * 100;
      if (bar) bar.style.width = pct + '%';
      if (time) time.textContent = `${Math.floor(a.currentTime / 60)}:${pad(Math.floor(a.currentTime % 60))}`;
    });
    a.addEventListener('ended', () => { btn.textContent = '▶'; if (bar) bar.style.width = '0%'; if (time) time.textContent = '0:00'; });
  }
}
function songCardHtml(m){
  return `<div class="song-card">
    <audio id="audio-${m.id}" data-mid="${esc(m.mid)}" preload="metadata" style="display:none"></audio>
    <div class="song-header"><div class="song-cover">🎵</div><div class="song-info"><div class="song-title">${esc(m.name)}</div><div class="song-size">${fmtSize(m.size||0)}</div></div></div>
    <div class="song-controls"><button class="song-btn" id="btn-play-${m.id}" data-act="playSong" data-id="${esc(m.id)}">▶</button><div class="song-track" data-act="seekSong" data-id="${esc(m.id)}"><div class="song-bar" id="pbar-${m.id}"></div></div><div class="song-time" id="time-${m.id}">0:00</div></div>
  </div>`;
}

// Stickers
const STK = [
  ['ok','👌','โอเค','#2e9d4f'],['thx','🙏','ขอบคุณ','#3b82f6'],['lol','🤣','ขำมาก','#f5b301'],
  ['love','🥰','รักนะ','#ec4899'],['tired','😩','เหนื่อยจัง','#a855f7'],['sleep','😴','ง่วง','#64748b'],
  ['cheer','💪','สู้ๆ','#f97316'],['yes','👍','ได้เลย','#22c55e'],['hi','👋','สวัสดี','#14b8a6']
];
function stickerHtml(id){ const s = STK.find(x => x[0] === id); return s ? `<div class="stk" style="--c:${s[3]}"><span class="e">${s[1]}</span><b>${esc(s[2])}</b></div>` : ''; }

// Notification & PWA
if ('serviceWorker' in navigator) {
  const sw = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('notificationclick',e=>{e.notification.close();e.waitUntil(clients.matchAll({type:'window'}).then(c=>c[0]?c[0].focus():clients.openWindow('/')));});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type:'application/javascript'}))).catch(()=>{});
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFERRED_PROMPT = e; });
function triggerRealNotification(title, body){
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body: body, icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f5bf5'><path d='M4 5h16v11H9l-5 4z'/></svg>" });
  }
}

// Render Chat & Messages
function renderChat(){
  const c = chatById(OPEN), box = $('#chat');
  if (!c) { $('#empty').classList.remove('hide'); box.classList.add('hide'); return; }
  $('#empty').classList.add('hide'); box.classList.remove('hide');
  box.innerHTML = `<header class="ch"><button class="ib only-m" data-act="back">${I('back')}</button><span class="av" style="width:40px;height:40px;background:#384b66">${esc(chatName(c)[0]||'?')}</span><div class="ttl"><b>${esc(chatName(c))}</b><small>${c.type==='dm'?'ส่วนตัว':'กลุ่ม'}</small></div>${ADMIN?`<button class="ib" data-act="adminSheet">${I('shield')}</button>`:''}</header>
    <div id="msgs"></div>
    <div id="rec"><i></i><span id="recT">0:00</span><button class="pbtn ghost" data-act="recCancel">ยกเลิก</button><button class="pbtn" data-act="recSend">ส่ง</button></div>
    <div id="comp">
      <button class="ib" data-act="pickImg" title="รูปภาพ">${I('image')}</button>
      <button class="ib" data-act="pickSong" title="ส่งเพลง">${I('music')}</button>
      <button class="ib" data-act="stickers" title="สติกเกอร์">${I('smile')}</button>
      <textarea id="inp" rows="1" placeholder="ส่งข้อความ..."></textarea>
      <button class="ib mic" data-act="recStart">${I('mic')}</button>
      <button class="send" data-act="sendText">ส่ง</button>
    </div>`;
  renderMsgs(true);
}

function renderMsgs(forceBottom){
  const el = $('#msgs'), c = chatById(OPEN); if (!el || !c) return;
  const ms = msgsOf(c.id); let h = '', pd = '';
  ms.forEach((m, i) => {
    const dk = dayKey(m.t); if (dk !== pd) { h += `<div class="day">${dayLbl(m.t)}</div>`; pd = dk; }
    const mine = m.from === ME;
    let body = m.type === 'text' ? `<div class="bub">${esc(m.text)}</div>` :
      m.type === 'sticker' ? `<div class="bub media">${stickerHtml(m.text)}</div>` :
      m.type === 'song' ? songCardHtml(m) :
      m.type === 'image' ? `<div class="med"><img data-mid="${esc(m.mid)}" alt=""></div>` :
      `<div class="bub">${esc(m.name||'ไฟล์')}</div>`;
    h += `<div class="row ${mine?'me':'ot'}" data-id="${esc(m.id)}">
      <button class="reaction-picker-trigger" data-act="openRxPicker" data-id="${esc(m.id)}">${I('smile')}</button>
      <div class="col">${!mine&&c.type==='group'?`<span class="nm">${esc(m.from)}</span>`:''}${body}${rxHtml(m)}<span class="tm">${hm(m.t)}</span></div>
      <button class="more" data-act="msgMenu" data-id="${esc(m.id)}">${I('more')}</button>
    </div>`;
  });
  el.innerHTML = h || '<div class="sys">ไม่มีข้อความ</div>';
  hydrate(el);
  if (forceBottom) el.scrollTop = el.scrollHeight;
}

function renderList(){
  const q = FILTER.trim().toLowerCase();
  const L = DB.chats.filter(c => !q || chatName(c).toLowerCase().includes(q));
  $('#clist').innerHTML = L.map(c => {
    const ms = msgsOf(c.id), last = ms[ms.length - 1];
    return `<button class="ci ${c.id===OPEN?'on':''}" data-act="open" data-id="${esc(c.id)}">
      <span class="av" style="width:48px;height:48px;background:#2d3a4d">${esc(chatName(c)[0]||'?')}</span>
      <div class="tx"><div class="tt"><b>${esc(chatName(c))}</b></div><div class="pv">${last?(last.type==='text'?last.text:last.type==='song'?'ส่งเพลง 🎵':'ไฟล์'):'แชทใหม่'}</div></div>
    </button>`;
  }).join('');
}

function openChat(id){ OPEN = id; document.body.classList.add('chat-open'); renderChat(); renderList(); }
function sendText(){ const t = $('#inp'), v = t.value.trim(); if (!v || !OPEN) return; addMsg(OPEN, { from:ME, type:'text', text:v }); t.value = ''; renderMsgs(true); renderList(); }
async function sendFile(file, isSong=false){
  if (!OPEN) return;
  const mt = file.type || '', type = isSong ? 'song' : mt.startsWith('image/') ? 'image' : 'file', id = uid();
  if (CLOUD) await sb.storage.from('chat-media').upload(id, file); else await putBlob(id, file);
  addMsg(OPEN, { from:ME, type:type, mid:id, mime:mt, name:file.name, size:file.size });
  renderMsgs(true); renderList();
}

// Delegated Events
const A = {
  open(t){ openChat(t.dataset.id); },
  back(){ OPEN = null; document.body.classList.remove('chat-open'); renderList(); },
  home(){ A.back(); },
  focusSearch(){ $('#cs').focus(); },
  pickImg(){ $('#fi1').click(); },
  pickSong(){ $('#fi_song').click(); },
  sendText: sendText,
  stickers(){
    $('#sheet').innerHTML = '<h3>สติกเกอร์</h3><div class="stkgrid">' + STK.map(s => `<button data-act="sendStk" data-id="${s[0]}">${stickerHtml(s[0])}</button>`).join('') + '</div>';
    $('#sheet').classList.add('on'); $('#sbg').classList.add('on');
  },
  sendStk(t){ addMsg(OPEN, { from:ME, type:'sticker', text:t.dataset.id }); $('#sheet').classList.remove('on'); $('#sbg').classList.remove('on'); renderMsgs(true); },
  openRxPicker(t){
    const old = $('.rx-popover'); if (old) old.remove();
    const pop = document.createElement('div'); pop.className = 'rx-popover';
    pop.innerHTML = RE.map(e => `<button data-act="applyR" data-id="${t.dataset.id}" data-e="${e}">${e}</button>`).join('');
    t.parentNode.appendChild(pop);
  },
  applyR(t){ applyReaction(t.dataset.id, t.dataset.e); },
  toggleReact(t){ applyReaction(t.dataset.id, t.dataset.e); },
  playSong(t){ togglePlaySong(t.dataset.id); },
  seekSong(t, e){ const a = $(`#audio-${t.dataset.id}`); if (a && a.duration) a.currentTime = ((e.clientX - t.getBoundingClientRect().left) / t.getBoundingClientRect().width) * a.duration; },
  settings(){
    $('#sheet').innerHTML = `<h3>ตั้งค่า</h3><hr style="border:0;border-top:1px solid #232b39;margin:12px 0">
      <button class="opt" data-act="promptName">${I('user')}<span>เปลี่ยนชื่อผู้ใช้ (${esc(ME)})</span></button>
      <button class="opt" data-act="installPWA">${I('download')}<span>ติดตั้งเป็นแอป (PWA)</span></button>
      <button class="opt" data-act="reqNotify">${I('bell')}<span>เปิดการแจ้งเตือนจริง</span></button>`;
    $('#sheet').classList.add('on'); $('#sbg').classList.add('on');
  },
  promptName(){ const n = prompt('ใส่ชื่อผู้ใช้ใหม่:', ME); if (n) { ME = n.trim(); LS.set('chat.me', ME); $('#uname').textContent = ME; renderList(); } },
  installPWA(){ if (DEFERRED_PROMPT) { DEFERRED_PROMPT.prompt(); DEFERRED_PROMPT = null; } else toast('กด Share/Menu บนเบราว์เซอร์ แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"'); },
  reqNotify(){
    if ('Notification' in window) {
      Notification.requestPermission().then(p => { if (p === 'granted') { toast('เปิดแจ้งเตือนแล้ว'); triggerRealNotification('ระบบแชท', 'แจ้งเตือนพร้อมใช้งาน'); } });
    }
  },
  closeSheet(){ $('#sheet').classList.remove('on'); $('#sbg').classList.remove('on'); }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = A[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener('change', e => {
  if (e.target.id === 'fi1' && e.target.files[0]) sendFile(e.target.files[0]);
  if (e.target.id === 'fi_song' && e.target.files[0]) sendFile(e.target.files[0], true);
});
document.addEventListener('input', e => {
  if (e.target.id === 'cs') { FILTER = e.target.value; renderList(); }
  if (e.target.id === 'inp') $('#comp').classList.toggle('has', !!e.target.value.trim());
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'inp') { e.preventDefault(); sendText(); }
});

function init(){
  $('#logoI').innerHTML = I('chat'); $('#rbChat').innerHTML = I('chat'); $('#rbSearch').innerHTML = I('search');
  $('#rbNew').innerHTML = I('plus'); $('#rbAdm').innerHTML = I('shield'); $('#rbSet').innerHTML = I('gear');
  $('#srI').innerHTML = I('search'); $('#emI').innerHTML = I('send');
  load();
  if (!ME) { ME = 'user_' + Math.floor(Math.random() * 900 + 100); LS.set('chat.me', ME); }
  $('#uname').textContent = ME;
  renderList();
  if (CLOUD) {
    sb.from('chat_rooms').select('*').then(r => { if (r.data) { DB.chats = r.data.map(rowToChat); renderList(); } });
    sb.from('chat_messages').select('*').then(r => {
      if (r.data) r.data.forEach(m => { msgsOf(m.chat_id).push(rowToMsg(m)); });
      if (OPEN) renderMsgs(true);
    });
    RLCH = sb.channel('public:chat').on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages' }, p => {
      const m = rowToMsg(p.new); msgsOf(p.new.chat_id).push(m);
      if (m.from !== ME && document.hidden) triggerRealNotification(m.from, m.type === 'song' ? 'ส่งเพลง 🎵' : m.text);
      if (OPEN === p.new.chat_id) renderMsgs(true);
      renderList();
    }).subscribe();
  }
}
init();
})();
</script>
